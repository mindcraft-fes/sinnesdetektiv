<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinnesdetektiv 🔍</title>
<meta property="og:title" content="Sinnesdetektiv">
<meta property="og:description" content="Entdecke deine Sinnesorgane – Texte, Aufgaben & Experimente">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="SinnesLogo.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1e2530;
  --border: #30363d; --accent: #58a6ff; --accent2: #3fb950;
  --accent3: #f78166; --accent4: #d2a8ff; --accent5: #ffa657;
  --text: #e6edf3; --text2: #8b949e; --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* START */
#startScreen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; background:radial-gradient(ellipse at 30% 20%, #1a2744 0%, #0d1117 60%); text-align:center; }
.logo-circle { width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#2d5a8e);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:3.5rem;margin-bottom:1.5rem;box-shadow:0 0 40px rgba(88,166,255,.3);animation:pulse 3s ease-in-out infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 40px rgba(88,166,255,.3)}50%{box-shadow:0 0 60px rgba(88,166,255,.5)} }
#startScreen h1 { font-family:'Outfit',sans-serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:800;background:linear-gradient(135deg,#58a6ff,#d2a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem; }
#startScreen p { color:var(--text2);font-size:1.1rem;margin-bottom:2rem;max-width:400px; }
.name-input-wrap { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;width:100%;max-width:420px;margin-bottom:1.5rem; }
.name-input-wrap label { display:block;font-weight:700;margin-bottom:.75rem;color:var(--accent); }
.name-input-wrap input { width:100%;padding:.85rem 1rem;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:1.05rem;outline:none;transition:border-color .2s; }
.name-input-wrap input:focus { border-color:var(--accent); }
.btn-primary { background:linear-gradient(135deg,#1f6feb,#388bfd);color:white;border:none;border-radius:12px;padding:.9rem 2.5rem;font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(31,111,235,.4); }
.btn-primary:hover { transform:translateY(-2px);box-shadow:0 6px 25px rgba(31,111,235,.5); }
.btn-primary:disabled { opacity:.4;cursor:not-allowed;transform:none; }

/* MODULES */
#moduleScreen { display:none;min-height:100vh;padding:2rem 1rem;max-width:700px;margin:0 auto; }
.top-bar { display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:.5rem; }
.top-bar h2 { font-family:'Outfit',sans-serif;font-weight:800;font-size:1.5rem; }
.player-badge { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:.4rem 1rem;font-size:.9rem;color:var(--text2); }
.modules-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem; }
.module-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden; }
.module-card:hover { border-color:var(--accent);transform:translateY(-2px); }
.module-card.completed { border-color:var(--accent2); }
.module-card::before { content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-color,var(--accent)); }
.module-icon { font-size:2.5rem;margin-bottom:.75rem; }
.module-title { font-family:'Outfit',sans-serif;font-weight:700;font-size:1.15rem;margin-bottom:.25rem; }
.module-desc { color:var(--text2);font-size:.9rem; }
.module-status { margin-top:.75rem;font-size:.85rem;font-weight:700; }
.status-done { color:var(--accent2); } .status-open { color:var(--text2); }
.highscore-btn { background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.6rem 1.2rem;color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;cursor:pointer;font-size:.9rem; }

/* CONTENT */
#contentScreen { display:none;min-height:100vh;padding:1.5rem 1rem 4rem;max-width:700px;margin:0 auto; }
.content-header { display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap; }
.back-btn { background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem 1rem;color:var(--text);font-family:'Nunito',sans-serif;cursor:pointer;font-size:.9rem; }
.progress-bar-wrap { flex:1;background:var(--surface);border-radius:10px;height:8px;overflow:hidden;min-width:100px; }
.progress-bar-fill { height:100%;background:linear-gradient(90deg,var(--accent),var(--accent4));border-radius:10px;transition:width .4s ease; }

/* CARDS */
.step-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;margin-bottom:1rem;animation:slideIn .3s ease; }
@keyframes slideIn { from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)} }
.step-label { display:inline-flex;align-items:center;gap:.4rem;background:var(--surface2);border-radius:20px;padding:.3rem .9rem;font-size:.8rem;font-weight:700;color:var(--accent);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.05em; }
.step-card h3 { font-family:'Outfit',sans-serif;font-weight:700;font-size:1.2rem;margin-bottom:1rem; }
.step-card p, .step-card li { line-height:1.75;color:var(--text2);margin-bottom:.5rem; }
.step-card strong { color:var(--text); }
.step-card ul, .step-card ol { padding-left:1.25rem;margin:.5rem 0; }
.info-box { background:rgba(88,166,255,.08);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:.75rem 1rem;margin:.75rem 0;color:var(--text2);font-size:.95rem; }

/* ZUORDNUNG */
.term-chips { display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0; }
.term-chip { background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:.4rem .9rem;font-size:.9rem;cursor:pointer;transition:all .2s;user-select:none; }
.term-chip:hover { border-color:var(--accent);color:var(--accent); }
.term-chip.selected { background:rgba(88,166,255,.15);border-color:var(--accent);color:var(--accent); }
.term-chip.used { opacity:.3;cursor:not-allowed;pointer-events:none; }
.drop-zone { background:var(--surface2);border:2px dashed var(--border);border-radius:8px;padding:.5rem .75rem;margin-bottom:.5rem;min-height:42px;display:flex;align-items:center;gap:.5rem;transition:all .2s;font-size:.9rem;cursor:pointer; }
.drop-zone:hover { border-color:var(--accent); }
.drop-zone.correct { border-color:var(--accent2);background:rgba(63,185,80,.1);color:var(--accent2); }
.drop-zone.wrong { border-color:var(--accent3);background:rgba(247,129,102,.1);color:var(--accent3); }
.drop-zone .zone-label { color:var(--text2);font-size:.85rem;flex:1; }

/* QUIZ */
.quiz-question { font-weight:700;font-size:1.05rem;margin-bottom:1rem;line-height:1.5; }
.answer-options { display:flex;flex-direction:column;gap:.6rem; }
.answer-btn { background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:.85rem 1.1rem;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-size:.95rem;cursor:pointer;transition:all .15s;line-height:1.4; }
.answer-btn:hover:not(:disabled) { border-color:var(--accent);background:rgba(88,166,255,.08); }
.answer-btn.correct { border-color:var(--accent2);background:rgba(63,185,80,.12);color:var(--accent2); }
.answer-btn.wrong { border-color:var(--accent3);background:rgba(247,129,102,.12);color:var(--accent3); }
.feedback-box { margin-top:.75rem;padding:.75rem 1rem;border-radius:8px;font-weight:600;font-size:.95rem;display:none; }
.feedback-box.show { display:block; }
.feedback-box.correct { background:rgba(63,185,80,.1);color:var(--accent2);border:1px solid var(--accent2); }
.feedback-box.wrong { background:rgba(247,129,102,.1);color:var(--accent3);border:1px solid var(--accent3); }

/* EXPERIMENT */
.experiment-phase { border-left:3px solid var(--accent5);padding-left:1rem;margin-bottom:1.25rem; }
.experiment-phase h4 { font-weight:700;color:var(--accent5);margin-bottom:.5rem;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em; }
.steps-list { list-style:none;counter-reset:steps; }
.steps-list li { counter-increment:steps;display:flex;gap:.75rem;margin-bottom:.75rem;color:var(--text2);line-height:1.6; }
.steps-list li::before { content:counter(steps);background:var(--accent5);color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;margin-top:2px; }
.textarea-wrap textarea { width:100%;padding:.85rem 1rem;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:.95rem;resize:vertical;min-height:90px;outline:none;transition:border-color .2s;line-height:1.6; }
.textarea-wrap textarea:focus { border-color:var(--accent); }
.word-counter { text-align:right;font-size:.8rem;color:var(--text2);margin-top:.25rem; }
.word-counter.ok { color:var(--accent2); }

/* BUTTONS */
.btn-next { background:linear-gradient(135deg,#238636,#2ea043);color:white;border:none;border-radius:10px;padding:.75rem 1.75rem;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s; }
.btn-next:hover { transform:translateY(-1px); }
.btn-next:disabled { opacity:.3;cursor:not-allowed;transform:none; }
.nav-buttons { display:flex;gap:.75rem;margin-top:1.25rem;flex-wrap:wrap; }

/* COMPLETION */
.completion-card { background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--accent2);border-radius:var(--radius);padding:2.5rem;text-align:center; }
.completion-card .big-icon { font-size:4rem;margin-bottom:1rem; }
.completion-card h2 { font-family:'Outfit',sans-serif;font-size:1.75rem;font-weight:800;margin-bottom:.5rem; }
.completion-card p { color:var(--text2);margin-bottom:1.5rem; }
.score-display { background:var(--surface2);border-radius:12px;padding:1rem;margin-bottom:1.5rem; }
.score-num { font-size:3rem;font-weight:900;font-family:'Outfit',sans-serif;color:var(--accent2);line-height:1; }
.score-label { color:var(--text2);font-size:.9rem; }

/* HIGHSCORE */
#highscoreScreen { display:none;min-height:100vh;padding:1.5rem 1rem 4rem;max-width:700px;margin:0 auto; }
.tabs { display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem; }
.tab-btn { background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.4rem .85rem;color:var(--text2);font-family:'Nunito',sans-serif;font-size:.85rem;cursor:pointer;transition:all .2s; }
.tab-btn.active { background:var(--accent);border-color:var(--accent);color:white; }
.hs-table { width:100%;border-collapse:collapse; }
.hs-table th { text-align:left;padding:.6rem .75rem;font-size:.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border); }
.hs-table td { padding:.75rem;border-bottom:1px solid var(--surface2);font-size:.95rem; }
.hs-table tr:hover td { background:var(--surface2); }
</style>
</head>
<body>

<div id="startScreen">
  <div class="logo-circle">🔍</div>
  <h1>Sinnesdetektiv</h1>
  <p>Entdecke die Geheimnisse deiner Sinnesorgane</p>
  <div class="name-input-wrap">
    <label>🧑 Dein Name</label>
    <input type="text" id="playerNameInput" placeholder="Name eingeben..." maxlength="30">
  </div>
  <button class="btn-primary" id="startBtn" disabled onclick="startApp()">Los geht's! →</button>
</div>

<div id="moduleScreen">
  <div class="top-bar">
    <h2>🔍 Sinnesdetektiv</h2>
    <span class="player-badge" id="playerBadge"></span>
    <button class="highscore-btn" onclick="showHighscore()">🏆 Highscore</button>
  </div>
  <div class="modules-grid" id="modulesGrid"></div>
</div>

<div id="contentScreen">
  <div class="content-header">
    <button class="back-btn" onclick="goBack()">← Zurück</button>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <span id="progressLabel" style="font-size:.85rem;color:var(--text2)"></span>
  </div>
  <div id="stepContainer"></div>
</div>

<div id="highscoreScreen">
  <div class="top-bar">
    <h2>🏆 Highscore</h2>
    <button class="back-btn" onclick="showModules()">← Zurück</button>
  </div>
  <div class="tabs" id="hsTabs"></div>
  <div id="hsContent"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVVhp-QCwpiIKXa9IfudSjVZT6bPnjkuGALue2C9TrskD5dsfqo8QxtkQ3Z1vpj9206A/exec";
let playerName = "";
let completedModules = JSON.parse(localStorage.getItem("sinnes_completed") || "{}");
let currentModule = null;
let currentStepIndex = 0;
let moduleScore = 0;

// ═══════════ MODULE DEFINITIONS ═══════════
const modules = [
  { id:"auge", icon:"👁️", title:"Das Auge", desc:"Aufbau, Funktion & Sehexperiment", color:"#58a6ff", steps: augeSteps() },
  { id:"ohr", icon:"👂", title:"Das Ohr", desc:"Aufbau, Funktion & Hörexperiment", color:"#d2a8ff", steps: ohrSteps() },
  { id:"nase", icon:"👃", title:"Die Nase", desc:"Aufbau, Funktion & Riechexperiment", color:"#3fb950", steps: naseSteps() },
  { id:"zunge", icon:"👅", title:"Die Zunge", desc:"Aufbau, Funktion & Schmeckexperiment", color:"#f78166", steps: zungeSteps() },
  { id:"haut", icon:"✋", title:"Die Haut", desc:"Aufbau, Funktion & Tastexperiment", color:"#ffa657", steps: hautSteps() },
  { id:"gehirn", icon:"🧠", title:"Gehirn & Nerven", desc:"Aufbau, Funktion & Gehirnexperiment", color:"#79c0ff", steps: gehirnSteps() }
];

function mkText(label, title, content) { return {type:"text",label,title,content}; }
function mkZuordnung(label, title, intro, terms, slots) { return {type:"zuordnung",label,title,intro,terms,slots}; }
function mkQuiz(label, questions) { return {type:"quiz",label,questions}; }
function mkExp(title, fragestellung, material, minH, minB, anleitung, erklaerung, hypothesePruefung) {
  return {type:"experiment",label:"🔬 Experiment",title,fragestellung,material,minWordsHypothese:minH,minWordsBeobachtung:minB,anleitung,erklaerung,hypothesePruefung};
}

// ════════════ AUGE ════════════
function augeSteps() { return [
  mkText("📖 Sachtext 1","Aufbau des Auges",`
    <p>Das Auge ist unser wichtigstes Sinnesorgan. Von außen siehst du die <strong>Hornhaut</strong> – eine durchsichtige Schutzschicht. Dahinter liegt die farbige <strong>Iris</strong>, die deine Augenfarbe bestimmt. In der Mitte befindet sich die <strong>Pupille</strong> – die schwarze Öffnung, durch die Licht ins Auge fällt.</p>
    <p>Hinter der Pupille liegt die <strong>Linse</strong>. Sie bündelt das Licht und wirft ein Bild auf die <strong>Netzhaut</strong> (Retina) auf der Rückseite des Auges. Dort sitzen Millionen Sinneszellen: <strong>Stäbchen</strong> (Hell/Dunkel) und <strong>Zapfen</strong> (Farben). Der <strong>Sehnerv</strong> leitet die Signale ans Gehirn.</p>
    <div class="info-box">💡 Das Auge ist nur 24 mm groß – enthält aber über 130 Millionen Sinneszellen!</div>`),
  mkZuordnung("🏷️ Zuordnung","Beschrifte das Auge","Klicke einen Begriff an – dann auf das passende Feld.",
    ["Hornhaut","Iris","Pupille","Linse","Netzhaut","Sehnerv"],
    [{id:"s1",label:"1 – Äußere, durchsichtige Schutzschicht",answer:"Hornhaut"},
     {id:"s2",label:"2 – Farbiger Ringmuskel (Augenfarbe)",answer:"Iris"},
     {id:"s3",label:"3 – Schwarze Öffnung in der Mitte",answer:"Pupille"},
     {id:"s4",label:"4 – Bündelt das Licht",answer:"Linse"},
     {id:"s5",label:"5 – Enthält Seh-Sinneszellen",answer:"Netzhaut"},
     {id:"s6",label:"6 – Leitet Signale zum Gehirn",answer:"Sehnerv"}]),
  mkQuiz("❓ Fragen zum Aufbau",[
    {q:"Was macht die Iris?",options:["Sie bündelt das Licht","Sie bestimmt die Augenfarbe und reguliert den Lichteinfall","Sie leitet Signale ins Gehirn","Sie schützt das Auge von außen"],correct:1,feedback:"Richtig! Die Iris gibt dem Auge seine Farbe und steuert, wie viel Licht durch die Pupille fällt."},
    {q:"Für was sind die Zapfen in der Netzhaut zuständig?",options:["Sehen bei Dunkelheit","Farbsehen","Scharfstellen","Augenbewegung"],correct:1,feedback:"Korrekt! Die Zapfen ermöglichen das Farbsehen, die Stäbchen das Sehen bei wenig Licht."},
    {q:"Was macht der Sehnerv?",options:["Er bündelt das Licht","Er wandelt Farben um","Er leitet Signale vom Auge zum Gehirn","Er hält das Auge feucht"],correct:2,feedback:"Genau! Der Sehnerv verbindet Auge und Gehirn."}]),
  mkText("📖 Sachtext 2","Wie funktioniert das Sehen?",`
    <p><strong>1. Licht tritt ein:</strong> Licht fällt durch Hornhaut und Pupille ins Auge. Die Iris reguliert dabei, wie viel Licht eingelassen wird – bei hellem Licht wird die Pupille kleiner, bei Dunkelheit größer.</p>
    <p><strong>2. Licht wird gebündelt:</strong> Die Linse wirft ein scharfes Bild auf die Netzhaut. Das Bild entsteht dabei <em>auf dem Kopf stehend</em> – das Gehirn dreht es wieder um!</p>
    <p><strong>3. Reiz wird weitergeleitet:</strong> Sinneszellen wandeln Licht in elektrische Signale um, die über den Sehnerv ans Gehirn gehen.</p>
    <p><strong>4. Gehirn verarbeitet:</strong> Das Gehirn setzt alles zu einem vollständigen Bild zusammen und ergänzt sogar fehlende Informationen.</p>
    <div class="info-box">💡 Das Bild auf deiner Netzhaut steht auf dem Kopf – erst dein Gehirn dreht es um!</div>`),
  mkQuiz("❓ Fragen zur Funktion",[
    {q:"Was passiert mit der Pupille bei hellem Licht?",options:["Sie wird größer","Sie wird kleiner","Sie verschwindet","Sie ändert die Farbe"],correct:1,feedback:"Richtig! Bei hellem Licht wird die Pupille kleiner, damit nicht zu viel Licht ins Auge fällt."},
    {q:"Wie erscheint das Bild auf der Netzhaut?",options:["Aufrecht und vergrößert","Auf dem Kopf stehend","Verschwommen","In Schwarz-Weiß"],correct:1,feedback:"Das Bild auf der Netzhaut ist umgekehrt – erst das Gehirn dreht es zurück."},
    {q:"Was ergänzt das Gehirn beim Sehen?",options:["Gar nichts","Fehlende Informationen im Bild","Die Farben","Den Abstand zu Objekten"],correct:1,feedback:"Genau! Das Gehirn füllt aktiv Lücken im Sehbild – wie beim blinden Fleck!"}]),
  mkExp("Den blinden Fleck entdecken",
    "Hat unser Auge eine Stelle, an der es nichts sieht?",
    "Ein Blatt Papier, einen Stift",15,20,
    ["Zeichne auf ein Blatt Papier links ein <strong>+</strong> und rechts einen <strong>Punkt ●</strong> – ca. 15 cm Abstand.",
     "Halte das Papier in Armabstand. Schließe das <strong>rechte Auge</strong>.",
     "Schaue mit dem linken Auge fest auf das <strong>+</strong>.",
     "Bewege das Papier <strong>langsam auf dich zu</strong> – halte den Blick auf dem + !",
     "Beobachte: Was passiert mit dem Punkt?"],
    {content:`<p>Der Punkt verschwindet – das ist dein <strong>blinder Fleck</strong>! Wo der Sehnerv aus dem Auge tritt, gibt es keine Sinneszellen.</p><p>Im Alltag merkst du das nicht, weil beide Augen sich ergänzen und das Gehirn die Lücke automatisch auffüllt.</p><div class="info-box">💡 Dein Gehirn erfindet, was in der Lücke sein sollte – du merkst es gar nicht!</div>`},
    [{q:"Was ist beim Experiment passiert?",options:["Der Punkt blieb sichtbar","Der Punkt wechselte die Farbe","Der Punkt verschwand an einer Stelle","Das + verschwand"],correct:2,feedback:"Genau! An einer bestimmten Distanz verschwindet der Punkt – das ist der blinde Fleck."},
     {q:"Warum fällt uns der blinde Fleck im Alltag nicht auf?",options:["Weil er sehr klein ist","Weil das Gehirn die Lücke auffüllt und wir zwei Augen haben","Weil sich das Auge dreht","Weil wir ihn ausblenden können"],correct:1,feedback:"Das Gehirn ergänzt die fehlende Information – wir nehmen die Lücke daher nicht wahr."}])
];}

// ════════════ OHR ════════════
function ohrSteps() { return [
  mkText("📖 Sachtext 1","Aufbau des Ohres",`
    <p>Das Ohr wandelt Schallwellen in Signale um. Es besteht aus drei Bereichen: <strong>Außenohr, Mittelohr</strong> und <strong>Innenohr</strong>.</p>
    <p>Die <strong>Ohrmuschel</strong> fängt Schallwellen auf und leitet sie durch den Gehörgang zum <strong>Trommelfell</strong> – einer dünnen Membran, die durch Schall zu schwingen beginnt.</p>
    <p>Im <strong>Mittelohr</strong> verstärken drei winzige Knochen die Schwingungen: <strong>Hammer, Amboss und Steigbügel</strong>. Im <strong>Innenohr</strong> liegt die spiralförmige <strong>Schnecke (Cochlea)</strong>. Dort wandeln Sinneszellen Schwingungen in elektrische Signale um, die der <strong>Hörnerv</strong> ans Gehirn sendet.</p>
    <div class="info-box">💡 Der Steigbügel ist der kleinste Knochen im Körper – er ist nur 3 mm groß!</div>`),

function naseSteps() { return [

    [{q:"Was haben die beiden Hände im lauwarmen Wasser gespürt?",options:["Beide dasselbe","Die Hand aus dem Kalten warm, die aus dem Warmen kalt","Beide fühlten nichts","Beide empfanden kalt"],correct:1,feedback:"Dieselbe Temperatur wurde völlig unterschiedlich wahrgenommen – relative Messung!"},
     {q:"Was messen unsere Temperaturrezeptoren?",options:["Die absolute Temperatur","Den Unterschied zur aktuellen Hauttemperatur","Die Lufttemperatur","Nur große Temperaturunterschiede"],correct:1,feedback:"Temperaturrezeptoren messen relative Veränderungen – das erklärt die Täuschung."}])
];}

    {q:"Warum kann das Gehirn uns durch optische Täuschungen täuschen?",options:["Weil Augen schlechte Daten liefern","Weil das Gehirn Informationen interpretiert und dabei irren kann","Weil wir zu wenig schlafen","Weil Täuschungen das Auge irritieren"],correct:1,feedback:"Das Auge liefert korrekte Daten – das Gehirn interpretiert sie auf Basis von Erfahrungen falsch."},

  mkExp("Der Stroop-Effekt",
    "Kann das Gehirn zwei widersprüchliche Informationen gleichzeitig verarbeiten?",
    "Stift und Papier (am besten Buntstifte)",15,25,
    ["Schreibe Farbwörter in der <strong>falschen Farbe</strong>: z.B. 'ROT' in blauer Farbe, 'BLAU' in roter Farbe, 'GRÜN' in gelber Farbe.",
     "Aufgabe 1: Lies die <strong>Wörter</strong> laut vor. Wie schnell geht das?",
     "Aufgabe 2: Nenne nur die <strong>Farbe</strong>, in der das Wort geschrieben ist – ignoriere das Wort!",

// ═══════════════════════════════════════════
//  APP LOGIC
// ═══════════════════════════════════════════
document.getElementById("playerNameInput").addEventListener("input", function() {
  document.getElementById("startBtn").disabled = this.value.trim().length < 2;
});
document.getElementById("playerNameInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && this.value.trim().length >= 2) startApp();
});

function startApp() {
  playerName = document.getElementById("playerNameInput").value.trim();
  document.getElementById("startScreen").style.display = "none";
  showModules();
}

function showModules() {
  document.getElementById("moduleScreen").style.display = "block";
  document.getElementById("contentScreen").style.display = "none";
  document.getElementById("highscoreScreen").style.display = "none";
  document.getElementById("playerBadge").textContent = "👤 " + playerName;
  const grid = document.getElementById("modulesGrid");
  grid.innerHTML = modules.map(m => {
    const done = completedModules[m.id];
    return `<div class="module-card ${done?'completed':''}" style="--card-color:${m.color}" onclick="startModule('${m.id}')">
      <div class="module-icon">${m.icon}</div>
      <div class="module-title">${m.title}</div>
      <div class="module-desc">${m.desc}</div>
      <div class="module-status ${done?'status-done':'status-open'}">${done?'✅ Abgeschlossen – '+done+' Punkte':'○ Noch offen'}</div>
    </div>`;
  }).join('');
}

function startModule(id) {
  currentModule = modules.find(m => m.id === id);
  currentStepIndex = 0; moduleScore = 0;
  document.getElementById("moduleScreen").style.display = "none";
  document.getElementById("contentScreen").style.display = "block";
  renderStep();
}

function goBack() { showModules(); }

function updateProgress() {
  const total = currentModule.steps.length;
  const pct = Math.round((currentStepIndex / total) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = currentStepIndex + "/" + total;
}

function renderStep() {
  updateProgress();
  if (currentStepIndex >= currentModule.steps.length) { renderCompletion(); return; }
  const step = currentModule.steps[currentStepIndex];
  const c = document.getElementById("stepContainer");
  c.innerHTML = "";
  if (step.type === "text") renderTextStep(step, c);
  else if (step.type === "zuordnung") renderZuordnungStep(step, c);
  else if (step.type === "quiz") renderQuizStep(step, c);
  else if (step.type === "experiment") renderExperimentStep(step, c);
}

function nextStep() {
  currentStepIndex++;
  renderStep();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderTextStep(step, c) {
  c.innerHTML = `<div class="step-card"><div class="step-label">${step.label}</div><h3>${step.title}</h3>${step.content}<div class="nav-buttons"><button class="btn-next" onclick="nextStep()">Weiter →</button></div></div>`;
}

function renderZuordnungStep(step, c) {
  let sel = null, filled = {}, used = {};
  function render() {
    c.innerHTML = `<div class="step-card"><div class="step-label">${step.label}</div><h3>${step.title}</h3>
      <p style="color:var(--text2);margin-bottom:1rem">${step.intro}</p>
      <div class="term-chips">${step.terms.map(t=>`<div class="term-chip ${sel===t?'selected':''} ${used[t]?'used':''}" onclick="__sel('${t}')">${t}</div>`).join('')}</div>
      <div style="margin-top:1rem">${step.slots.map(s=>{const v=filled[s.id],ok=v&&v===s.answer,bad=v&&v!==s.answer;return`<div class="drop-zone ${ok?'correct':bad?'wrong':''}" onclick="__drop('${s.id}')"><span class="zone-label">${s.label}</span>${v?`<strong>${v}</strong> ${ok?'✓':bad?'✗':''}`:'<span style="color:var(--border)">—</span>'}</div>`}).join('')}</div>
      <div id="zfb" style="margin-top:1rem"></div>
      <div class="nav-buttons"><button class="btn-next" onclick="__chk()">Überprüfen ✓</button></div></div>`;
  }
  window.__sel = t => { if(used[t])return; sel=sel===t?null:t; render(); };
  window.__drop = id => {
    if(!sel)return;
    Object.keys(filled).forEach(k=>{if(filled[k]===sel)delete filled[k];});
    filled[id]=sel; step.terms.forEach(t=>{used[t]=Object.values(filled).includes(t);}); sel=null; render();
  };
  window.__chk = () => {
    let ok=0; step.slots.forEach(s=>{if(filled[s.id]===s.answer)ok++;});
    const total=step.slots.length, fb=document.getElementById("zfb");
    if(ok===total){fb.innerHTML=`<div class="feedback-box correct show">🎉 Perfekt! Alle ${total} richtig!</div>`;moduleScore+=total;setTimeout(()=>nextStep(),1500);}
    else{step.slots.forEach(s=>{if(filled[s.id]&&filled[s.id]!==s.answer){used[filled[s.id]]=false;delete filled[s.id];}});render();document.getElementById("zfb").innerHTML=`<div class="feedback-box wrong show">${ok}/${total} richtig – falsche zurückgesetzt, versuch nochmal!</div>`;}
  };
  render();
}

function renderQuizStep(step, c) {
  let qi=0, ans=[];
  function rq() {
    if(qi>=step.questions.length){moduleScore+=ans.filter(Boolean).length;c.innerHTML=`<div class="step-card"><div class="step-label">✅ Abschnitt done</div><h3>${ans.filter(Boolean).length}/${step.questions.length} richtig</h3><p style="color:var(--text2)">Weiter!</p><div class="nav-buttons"><button class="btn-next" onclick="nextStep()">Weiter →</button></div></div>`;return;}
    const q=step.questions[qi];
    c.innerHTML=`<div class="step-card"><div class="step-label">${step.label} (${qi+1}/${step.questions.length})</div>
      <div class="quiz-question">${q.q}</div>
      <div class="answer-options">${q.options.map((o,i)=>`<button class="answer-btn" onclick="__qa(${i})">${o}</button>`).join('')}</div>
      <div class="feedback-box" id="qfb"></div></div>`;
  }
  window.__qa = idx => {
    const q=step.questions[qi];
    document.querySelectorAll(".answer-btn").forEach(b=>b.disabled=true);
    document.querySelectorAll(".answer-btn")[idx].classList.add(idx===q.correct?"correct":"wrong");
    document.querySelectorAll(".answer-btn")[q.correct].classList.add("correct");
    const fb=document.getElementById("qfb"); fb.textContent=q.feedback; fb.className=`feedback-box show ${idx===q.correct?"correct":"wrong"}`;
    ans.push(idx===q.correct); setTimeout(()=>{qi++;rq();},2000);
  };
  rq();
}

function renderExperimentStep(step, c) {
  let hyp="", beob="", hypOk=false, beobOk=false, pAns=[];
  const wc = t => t.trim().split(/\s+/).filter(w=>w.length>0).length;
  function render() {
    let html=`<div class="step-card"><div class="step-label">${step.label}</div><h3>🔬 ${step.title}</h3>
    <div class="experiment-phase"><h4>🔍 Fragestellung</h4><p>${step.fragestellung}</p></div>
    <div class="experiment-phase"><h4>🧰 Material</h4><p style="color:var(--text2)">${step.material}</p></div>
    <div class="experiment-phase"><h4>💭 Meine Hypothese</h4>
      <p style="color:var(--text2);font-size:.9rem;margin-bottom:.5rem">Was glaubst du: Was wird passieren? (mind. ${step.minWordsHypothese} Wörter)</p>
      <div class="textarea-wrap"><textarea id="hta" rows="3" placeholder="Ich vermute, dass..."></textarea>
      <div class="word-counter" id="hwc">0 / ${step.minWordsHypothese} Wörter</div></div>
      ${hypOk?'<div class="feedback-box correct show">✅ Hypothese gespeichert!</div>':`<button class="btn-next" style="margin-top:.5rem" onclick="__sh()">Hypothese speichern →</button>`}
    </div>`;
    if(hypOk){html+=`<div class="experiment-phase" style="margin-top:1rem"><h4>⚗️ Durchführung</h4><ul class="steps-list">${step.anleitung.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="experiment-phase" style="margin-top:1rem"><h4>👁️ Meine Beobachtung</h4>
      <p style="color:var(--text2);font-size:.9rem;margin-bottom:.5rem">Beschreibe genau, was du beobachtet hast! (mind. ${step.minWordsBeobachtung} Wörter)</p>
      <div class="textarea-wrap"><textarea id="bta" rows="4" placeholder="Ich habe beobachtet, dass..."></textarea>
      <div class="word-counter" id="bwc">0 / ${step.minWordsBeobachtung} Wörter</div></div>
      ${beobOk?'<div class="feedback-box correct show">✅ Beobachtung gespeichert – Erklärung freigeschaltet! 🔓</div>':`<button class="btn-next" style="margin-top:.5rem" onclick="__sb()">Beobachtung speichern →</button>`}
    </div>`;}
    if(beobOk){html+=`<div class="experiment-phase" style="margin-top:1.5rem;border-color:var(--accent2)"><h4 style="color:var(--accent2)">💡 Erklärung (freigeschaltet!)</h4>${step.erklaerung.content}</div>
    <div class="experiment-phase" style="margin-top:1.5rem;border-color:var(--accent4)"><h4 style="color:var(--accent4)">🔎 Hypothese prüfen</h4>`;
    step.hypothesePruefung.forEach((q,qi)=>{const a=pAns[qi];html+=`<p style="font-weight:700;margin:.75rem 0 .5rem">${qi+1}. ${q.q}</p><div class="answer-options">${q.options.map((o,i)=>{let cls='';if(a!==undefined){if(i===q.correct)cls='correct';else if(i===a&&a!==q.correct)cls='wrong';}return`<button class="answer-btn ${cls}" ${a!==undefined?'disabled':''} onclick="__ap(${qi},${i})">${o}</button>`;}).join('')}</div>${a!==undefined?`<div class="feedback-box show ${a===q.correct?'correct':'wrong'}">${q.feedback}</div>`:''}`; });
    if(pAns.length===step.hypothesePruefung.length){html+=`<div style="margin-top:1.25rem"><h4 style="color:var(--accent4);margin-bottom:.5rem">✍️ Mein Fazit</h4><p style="color:var(--text2);font-size:.9rem;margin-bottom:.5rem">War deine Hypothese richtig? Begründe!</p><div class="textarea-wrap"><textarea id="fta" rows="3" placeholder="Meine Hypothese war... weil..."></textarea></div><button class="btn-next" style="margin-top:.5rem" onclick="nextStep()">Experiment abschließen ✓</button></div>`;}
    html+=`</div>`;}
    html+=`</div>`; c.innerHTML=html;
    const ht=document.getElementById("hta"),hw=document.getElementById("hwc");
    if(ht){ht.value=hyp;ht.addEventListener("input",function(){hyp=this.value;const w=wc(this.value);hw.textContent=`${w} / ${step.minWordsHypothese} Wörter`;hw.className=`word-counter${w>=step.minWordsHypothese?' ok':''}`;});const w=wc(ht.value);hw.textContent=`${w} / ${step.minWordsHypothese} Wörter`;hw.className=`word-counter${w>=step.minWordsHypothese?' ok':''}`;}
    const bt=document.getElementById("bta"),bw=document.getElementById("bwc");
    if(bt){bt.value=beob;bt.addEventListener("input",function(){beob=this.value;const w=wc(this.value);bw.textContent=`${w} / ${step.minWordsBeobachtung} Wörter`;bw.className=`word-counter${w>=step.minWordsBeobachtung?' ok':''}`;});const w=wc(bt.value);bw.textContent=`${w} / ${step.minWordsBeobachtung} Wörter`;bw.className=`word-counter${w>=step.minWordsBeobachtung?' ok':''}`;}
  }
  window.__sh=()=>{hyp=document.getElementById("hta")?.value||"";if(wc(hyp)<step.minWordsHypothese){alert(`Bitte mind. ${step.minWordsHypothese} Wörter!`);return;}hypOk=true;render();};
  window.__sb=()=>{beob=document.getElementById("bta")?.value||"";if(wc(beob)<step.minWordsBeobachtung){alert(`Bitte mind. ${step.minWordsBeobachtung} Wörter!`);return;}beobOk=true;render();};
  window.__ap=(qi,idx)=>{if(pAns[qi]!==undefined)return;pAns[qi]=idx;if(idx===step.hypothesePruefung[qi].correct)moduleScore++;render();setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'end'}),100);};
  render();
}

function renderCompletion() {
  const m = currentModule;
  completedModules[m.id] = moduleScore;
  localStorage.setItem("sinnes_completed", JSON.stringify(completedModules));
  fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:`${playerName} ${m.icon}`,score:moduleScore,module:m.title})}).catch(()=>{});
  document.getElementById("stepContainer").innerHTML=`<div class="completion-card"><div class="big-icon">${m.icon}</div><h2>${m.title} abgeschlossen!</h2><p>Super gemacht, ${playerName}!</p><div class="score-display"><div class="score-num">${moduleScore}</div><div class="score-label">Punkte erreicht</div></div><button class="btn-next" onclick="showModules()">Zurück zur Übersicht →</button></div>`;
  updateProgress();
}

async function showHighscore() {
  document.getElementById("moduleScreen").style.display="none";
  document.getElementById("highscoreScreen").style.display="block";
  const tabs=document.getElementById("hsTabs"),cont=document.getElementById("hsContent");
  tabs.innerHTML=`<div class="tab-btn active" onclick="hsTab('all',this)">Alle</div>${modules.map(m=>`<div class="tab-btn" onclick="hsTab('${m.id}',this)">${m.icon} ${m.title}</div>`).join('')}`;
  cont.innerHTML=`<p style="color:var(--text2)">Lade...</p>`;
  try{const r=await fetch(SCRIPT_URL);window.__hsd=(await r.json()).slice(1);hsTab('all',tabs.querySelector('.tab-btn'));}
  catch(e){cont.innerHTML=`<p style="color:var(--accent3)">Konnte nicht geladen werden.</p>`;}
}

function hsTab(id,btn) {
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
  const data=window.__hsd||[];
  const f=id==='all'?data:data.filter(r=>{const m=modules.find(m=>m.id===id);return m&&String(r[0]).includes(m.icon);});
  const s=[...f].sort((a,b)=>(b[1]||0)-(a[1]||0)).slice(0,15),md=["🥇","🥈","🥉"];
  document.getElementById("hsContent").innerHTML=`<table class="hs-table"><thead><tr><th>#</th><th>Name</th><th>Punkte</th><th>Datum</th></tr></thead><tbody>${s.map((r,i)=>`<tr><td>${md[i]||(i+1)}</td><td>${r[0]||"–"}</td><td><strong>${r[1]||0}</strong></td><td style="color:var(--text2);font-size:.85rem">${r[2]||"–"}</td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--text2);text-align:center;padding:2rem">Noch keine Einträge</td></tr>'}</tbody></table>`;
}
</script>
