<style>
:root{--bg:#0d1117;--s:#161b22;--s2:#1e2530;--bd:#30363d;--a:#58a6ff;--a2:#3fb950;--a3:#f78166;--a4:#d2a8ff;--a5:#ffa657;--t:#e6edf3;--t2:#8b949e;--r:16px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;}

#S>p{color:var(--t2);margin-bottom:1.75rem;max-width:360px;line-height:1.6;}
.nb{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:1.6rem;width:100%;max-width:400px;margin-bottom:1.25rem;}

.nb input{width:100%;padding:.75rem 1rem;border-radius:10px;border:2px solid var(--bd);background:var(--s2);color:var(--t);font-family:'Nunito',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;}

.tb{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.mt{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.25);border-radius:20px;padding:.25rem .75rem;font-size:.78rem;color:var(--a);font-weight:700;}
.pw{flex:1;background:var(--s);border-radius:10px;height:7px;overflow:hidden;min-width:80px;}
.pf{height:100%;background:linear-gradient(90deg,var(--a),var(--a4));border-radius:10px;transition:width .4s;}
.pl{font-size:.78rem;color:var(--t2);}
.card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:1.6rem;margin-bottom:.85rem;animation:fu .28s ease;}

.ib{background:rgba(88,166,255,.07);border-left:3px solid var(--a);border-radius:0 8px 8px 0;padding:.65rem .9rem;margin:.65rem 0;color:var(--t2);font-size:.91rem;}
.wb{background:rgba(255,166,87,.07);border-left:3px solid var(--a5);border-radius:0 8px 8px 0;padding:.65rem .9rem;margin:.65rem 0;color:var(--t2);font-size:.91rem;}

.tp{display:flex;flex-wrap:wrap;gap:.4rem;padding:.85rem;background:var(--s2);border-radius:10px;border:1px solid var(--bd);min-height:46px;margin-bottom:.85rem;}

.ro{display:flex;flex-direction:column;gap:.55rem;margin:.85rem 0;}
.rop{display:flex;align-items:flex-start;gap:.75rem;background:var(--s2);border:2px solid var(--bd);border-radius:10px;padding:.85rem 1rem;cursor:pointer;}

.rop input{width:18px;height:18px;accent-color:var(--a);cursor:pointer;flex-shrink:0;margin-top:1px;}
.rop span{color:var(--t2);font-size:.92rem;line-height:1.5;}
.cl{display:flex;flex-direction:column;gap:.45rem;margin:.5rem 0;}
.ci{display:flex;align-items:flex-start;gap:.7rem;padding:.65rem .8rem;background:var(--s2);border-radius:8px;border:1px solid var(--bd);cursor:pointer;}
.ci.done{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.25);}
.ci input[type=checkbox]{width:17px;height:17px;accent-color:var(--a2);cursor:pointer;flex-shrink:0;margin-top:2px;}
.ci .st{color:var(--t2);font-size:.9rem;line-height:1.55;}
.ci.done .st{opacity:.6;}
.hw{display:flex;flex-wrap:wrap;gap:.35rem;margin:.45rem 0 .65rem;}
.hwb{background:rgba(210,168,255,.07);border:1px solid rgba(210,168,255,.22);border-radius:6px;padding:.22rem .6rem;font-size:.8rem;color:var(--a4);cursor:pointer;}
.hwb:hover{background:rgba(210,168,255,.14);}
.fl label{display:block;font-size:.83rem;font-weight:700;color:var(--t2);margin-bottom:.35rem;}
.fl textarea{width:100%;padding:.7rem .9rem;border-radius:10px;border:2px solid var(--bd);background:var(--s2);color:var(--t);font-family:'Nunito',sans-serif;font-size:.91rem;resize:vertical;min-height:78px;outline:none;transition:border-color .2s;line-height:1.6;}
.fl textarea:focus{border-color:var(--a);}
.fl .hint{font-size:.76rem;color:var(--t2);margin-top:.22rem;font-style:italic;}
.fl{margin:.5rem 0;}
.hc{background:rgba(210,168,255,.06);border:1px solid rgba(210,168,255,.18);border-radius:10px;padding:.9rem 1rem;margin:.65rem 0;}
.hc .hl{font-size:.76rem;font-weight:700;color:var(--a4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem;}
.hc .ht{color:var(--t2);font-style:italic;line-height:1.6;}
.bs{background:linear-gradient(135deg,#1f6feb,#388bfd);color:white;border:none;border-radius:10px;padding:.62rem 1.45rem;font-family:'Nunito',sans-serif;font-size:.91rem;font-weight:700;cursor:pointer;}
.bn{background:linear-gradient(135deg,#238636,#2ea043);color:white;border:none;border-radius:10px;padding:.72rem 1.7rem;font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;}
.bpdf{background:linear-gradient(135deg,#6e40c9,#8957e5);color:white;border:none;border-radius:10px;padding:.72rem 1.7rem;font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;}
.nr{display:flex;gap:.65rem;margin-top:1.1rem;flex-wrap:wrap;align-items:center;}
.pt{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.55rem;}
.dc{background:linear-gradient(135deg,var(--s),var(--s2));border:1px solid var(--a2);border-radius:var(--r);padding:2.25rem;text-align:center;}
.dc h2{font-family:'Outfit',sans-serif;font-size:1.65rem;font-weight:800;margin-bottom:.4rem;}
.sco{font-size:2.8rem;font-weight:900;font-family:'Outfit',sans-serif;color:var(--a2);line-height:1;}
.sr{display:flex;gap:.25rem;}
.str{font-size:1.3rem;cursor:pointer;filter:grayscale(1) opacity(.35);}
.str.on{filter:none;}
.rg{display:flex;flex-direction:column;gap:.6rem;margin:.6rem 0;}
.rr{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;}
.rr label{flex:1;min-width:170px;color:var(--t2);font-size:.9rem;}
.pt2{color:var(--a5);}
</style>

<body>
<div id="ov" onclick="closeImg()">
  <span>x  Tippen zum Schliessen</span>
  <img id="oi" src="" alt="">
</div>

<div id="S">
  <div class="lc">&#128065;&#65039;</div>
  <h1>Das Auge</h1>
  <p>Entdecke Aufbau, Funktion und das Geheimnis des blinden Flecks</p>
  <div class="nb">
    <label>Dein Name</label>
    <input type="text" id="nIn" placeholder="Vorname Nachname" maxlength="40">
    <div class="cr">
      <input type="text" id="cIn" placeholder="Klasse z.B. 5b" maxlength="10">
      <input type="date" id="dIn">
    </div>
  </div>
  <button class="bp" id="goBtn" type="button">Los geht's</button>
</div>

<div id="C">
  <div class="tb">
    <span class="mt">Das Auge</span>
    <div class="pw"><div class="pf" id="pFill" style="width:0%"></div></div>
    <span class="pl" id="pLbl">0/9</span>
  </div>
  <div id="box"></div>
</div>

<script>
var sName="", sClass="", sDate="", idx=0, score=0;
var saved={hyp:"",beob:"",fazit:"",rc:"",ref:{v:0,s:0,c:0},qa:[],hc:""};
var TOTAL=9;

function init(){
  var di=document.getElementById("dIn");
  var t=new Date();
  var m=t.getMonth()+1;
  var d=t.getDate();
  di.value=t.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d;
  document.getElementById("goBtn").onclick=startApp;
}

function startApp(){
  var v=document.getElementById("nIn").value;
  if(!v||v.trim().length<2){
    document.getElementById("nIn").style.borderColor="#f78166";
    document.getElementById("nIn").focus();
    return;
  }
  sName=v.trim();
  sClass=document.getElementById("cIn").value.trim()||"-";
  var dv=document.getElementById("dIn").value;
  if(dv){
    var parts=dv.split("-");
    sDate=parts[2]+"."+parts[1]+"."+parts[0];
  } else {
    var t2=new Date();
    sDate=t2.getDate()+"."+(t2.getMonth()+1)+"."+t2.getFullYear();
  }
  document.getElementById("S").style.display="none";
  document.getElementById("C").style.display="block";
  render();
}

window.onload=init;

function updP(){
  document.getElementById("pFill").style.width=Math.round(idx/TOTAL*100)+"%";
  document.getElementById("pLbl").textContent=idx+"/"+TOTAL;
}
function next(){idx++;render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  updP();
  if(idx>=TOTAL){renderDone();return;}
  var box=document.getElementById("box");
  box.innerHTML="";
  var steps=["t1","zu","q1","vi","q2","ei","em","ee","re"];
  var s=steps[idx];
  if(s==="t1") renderT1(box);
  else if(s==="zu") renderZu(box);
  else if(s==="q1") renderQuiz(box,Q1,"Fragen zum Aufbau",1);
  else if(s==="vi") renderVid(box);
  else if(s==="q2") renderQuiz(box,Q2,"Fragen zum Video",2);
  else if(s==="ei") renderEI(box);
  else if(s==="em") renderEM(box);
  else if(s==="ee") renderEE(box);
  else if(s==="re") renderRe(box);
}

function renderT1(c){
  c.innerHTML='<div class="card">'
    +'<div class="bg">Sachtext 1 - Aufbau des Auges</div>'
    +'<h3>Wie ist unser Auge aufgebaut?</h3>'
    +'<p>Das Auge ist unser wichtigstes Sinnesorgan. Schau dir das Schaubild genau an, waehrend du den Text liest.</p>'
    +'<div class="iw"><img src="AufbauAuge.jpg" alt="Aufbau des Auges" onclick="openImg(this.src)"><div class="ih">Auf das Bild klicken fuer Vollbild</div></div>'
    +'<p>Von aussen erkennst du die <strong>Hornhaut</strong> - eine durchsichtige, gewoelbte Schutzschicht. Dahinter liegt die farbige <strong>Iris</strong>, die deine Augenfarbe bestimmt. In ihrer Mitte befindet sich die <strong>Pupille</strong> - die schwarze Oeffnung, durch die Licht ins Auge gelangt.</p>'
    +'<p>Hinter der Pupille liegt die <strong>Linse</strong>. Sie buendelt das Licht auf die <strong>Netzhaut</strong> auf der Rueckseite des Auges. Dort sitzen Millionen Sinneszellen: <strong>Staebchen</strong> (Hell/Dunkel) und <strong>Zapfen</strong> (Farben).</p>'
    +'<p>Die Signale der Netzhaut werden ueber den <strong>Sehnerv</strong> ans <strong>Gehirn</strong> geleitet. Erst das Gehirn erzeugt das vollstaendige Bild.</p>'
    +'<div class="ib">Das Auge ist nur 24 mm gross - enthaelt aber ueber 130 Millionen Sinneszellen!</div>'
    +'<p>Das <strong>Augenlid</strong> schuetzt das Auge durch reflexartiges Schliessen. Die <strong>Traenenfluessigkeit</strong> haelt die Oberflaeche feucht, sauber und keimfrei.</p>'
    +'<div class="wb"><strong>Denke schon mal nach:</strong> Der Sehnerv verlaesst das Auge an einer bestimmten Stelle. Was koennte das fuer unser Sehen bedeuten? Du wirst es im Experiment selbst herausfinden!</div>'
    +'<div class="sb"><strong>Alltagsbeispiel:</strong> Wenn du nach draussen in die Sonne gehst, kneifen die Augen kurz - die Pupille wird kleiner, um sie vor zu viel Licht zu schuetzen.</div>'
    +'<div class="nr"><button class="bn" onclick="next()">Weiter zur Zuordnung</button></div>'
    +'</div>';
}

var Q1=[
  {q:"Was macht die Iris im Auge?",
   o:["Sie buendelt das Licht auf die Netzhaut","Sie regelt die Pupillengroesse und bestimmt die Augenfarbe","Sie schuetzt das Auge von aussen","Sie wandelt Licht in Signale um"],
   c:1,e:"Die Iris ist der farbige Ringmuskel - sie bestimmt die Augenfarbe und steuert, wie viel Licht durch die Pupille ins Auge faellt."},
  {q:"Welche zwei Arten von Sinneszellen sitzen auf der Netzhaut?",
   o:["Nerven und Fasern","Staebchen und Zapfen","Hornhaut und Linse","Iris und Pupille"],
   c:1,e:"Staebchen erkennen Hell und Dunkel. Zapfen sind fuer das Farbsehen zustaendig."},
  {q:"Wozu dient das Gehirn beim Sehen?",
   o:["Es produziert die Traenenfluessigkeit","Es regelt die Pupillengroesse","Es verarbeitet die Signale vom Sehnerv und erzeugt das Bild","Es buendelt das Licht"],
   c:2,e:"Ohne Gehirn ergeben die Signale des Auges kein Bild. Das Gehirn ist die eigentliche Bildverarbeitungszentrale!"}
];
var Q2=[
  {q:"Was ist die Aufgabe des Augenlids und der Traenenfluessigkeit?",
   o:["Augenlid buendelt Licht; Traenen sorgen fuer Farben","Augenlid schuetzt durch Schliessen; Traenen halten die Oberflaeche feucht und sauber","Augenlid leitet Licht weiter; Traenen aktivieren die Zapfen","Beide haben keine besondere Funktion"],
   c:1,e:"Das Augenlid schliesst sich blitzschnell als Schutzreflex. Die Traenenfluessigkeit haelt das Auge feucht und schuetzt es vor Keimen."},
  {q:"Wie erscheint das Bild auf der Netzhaut?",
   o:["Aufrecht und farbig","Auf dem Kopf stehend und seitenverkehrt","Verschwommen und schwarz-weiss","Vergroessert und hell"],
   c:1,e:"Die Linse wirft das Bild umgekehrt auf die Netzhaut - erst das Gehirn dreht es wieder in die richtige Position!"},
  {q:"Was passiert mit der Pupille, wenn es sehr hell wird?",
   o:["Sie wird groesser, um mehr Licht hereinzulassen","Sie wird kleiner, damit nicht zu viel Licht ins Auge faellt","Sie veraendert ihre Farbe","Sie verschwindet"],
   c:1,e:"Bei hellem Licht zieht sich die Iris zusammen - die Pupille wird kleiner. Bei Dunkelheit oeffnet sie sich weit."},
  {q:"Wofuer sind die Zapfen zustaendig?",
   o:["Fuer das Sehen bei Dunkelheit","Fuer das Farbsehen bei gutem Licht","Fuer das Weiterleiten der Signale","Fuer das Scharfstellen der Linse"],
   c:1,e:"Die Zapfen ermoeglichen das Farbsehen. Es gibt drei Typen: fuer Rot, Gruen und Blau."}
];

function renderZu(c){
  var terms=["Hornhaut","Iris","Pupille","Linse","Netzhaut","Sehnerv","Staebchen und Zapfen","Gehirn"];
  var slots=[
    {id:"z1",l:"Aeussere durchsichtige Schutzschicht",a:"Hornhaut"},
    {id:"z2",l:"Farbiger Ringmuskel - bestimmt die Augenfarbe",a:"Iris"},
    {id:"z3",l:"Schwarze Oeffnung, durch die Licht ins Auge faellt",a:"Pupille"},
    {id:"z4",l:"Buendelt das Licht auf die Netzhaut",a:"Linse"},
    {id:"z5",l:"Innenauskleidung mit Millionen Sinneszellen",a:"Netzhaut"},
    {id:"z6",l:"Leitet Signale vom Auge zum Gehirn",a:"Sehnerv"},
    {id:"z7",l:"Sinneszellen fuer Hell/Dunkel und Farben",a:"Staebchen und Zapfen"},
    {id:"z8",l:"Verarbeitet die Signale und erzeugt das Bild",a:"Gehirn"}
  ];
  var sel=null,filled={},used={};
  function draw(){
    var html='<div class="card"><div class="bg">Zuordnung</div><h3>Was gehoert wohin?</h3>'
      +'<p style="color:var(--t2);margin-bottom:.9rem"><strong style="color:var(--t)">So geht\'s:</strong> Klicke zuerst einen Begriff an, dann das passende Feld.</p>'
      +'<div class="iw"><img src="Zuordnung.jpg" alt="Auge" onclick="openImg(this.src)" style="max-height:270px;object-fit:contain;"><div class="ih">Bild vergroessern als Hilfe</div></div>'
      +'<div class="tpl">Begriffe</div><div class="tp">';
    terms.forEach(function(t){
      html+='<div class="ch'+(sel===t?' sel':'')+(used[t]?' used':'')+'" onclick="__zs(\''+t+'\')">'+t+'</div>';
    });
    html+='</div><div>';
    slots.forEach(function(s,i){
      var v=filled[s.id],ok=v&&v===s.a,bad=v&&v!==s.a;
      var slCls='sl'+(ok?' ok':bad?' bad':'');
      var slVal=v?v:("- waehlen -");
      html+='<div class="'+slCls+'" onclick="__zd(\''+s.id+'\')"><span class="sn">'+(i+1)+'</span><span class="sl2">'+s.l+'</span><span class="sv">'+slVal+'</span></div>';
    });

      +'<div class="nr"><button class="bs" onclick="__zck()">Ueberpruefen</button></div></div>';
    c.innerHTML=html;
  }
  window.__zs=function(t){if(used[t])return;sel=(sel===t)?null:t;draw();};
  window.__zd=function(id){
    if(!sel)return;
    for(var k in filled){if(filled[k]===sel)delete filled[k];}
    filled[id]=sel;
    terms.forEach(function(t){used[t]=Object.values(filled).indexOf(t)>=0;});
    sel=null;draw();
  };
  window.__zck=function(){
    var ok=0;
    slots.forEach(function(s){if(filled[s.id]===s.a)ok++;});
    if(ok===slots.length){
      document.getElementById("zfb").innerHTML='<div style="color:var(--a2);font-weight:700;margin-top:.5rem">Perfekt! Alle '+slots.length+' richtig!</div>';
      score+=slots.length;setTimeout(function(){next();},1500);
    } else {
      slots.forEach(function(s){if(filled[s.id]&&filled[s.id]!==s.a){used[filled[s.id]]=false;delete filled[s.id];}});
      draw();
      document.getElementById("zfb").innerHTML='<div style="color:var(--a3);font-weight:700;margin-top:.5rem">'+ok+'/'+slots.length+' richtig - falsche Felder zurueckgesetzt.</div>';

  };
  draw();
}

function makePDF(){
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  var W=210,H=297,ML=15,MR=195,TW=180;
  var y=14;
  function sf(r,g,b){doc.setFillColor(r,g,b);}
  function ss(r,g,b,w){doc.setDrawColor(r,g,b);doc.setLineWidth(w||0.25);}
  function st(r,g,b,sz,bold){doc.setTextColor(r,g,b);doc.setFontSize(sz);doc.setFont("helvetica",bold?"bold":"normal");}
  function chk(n){if(y+(n||12)>H-12){doc.addPage();sf(13,17,23);doc.rect(0,0,W,H,"F");y=14;}}
  function cl(s){
    if(!s)return"";
    return String(s).replace(/[\u0100-\uFFFF]/g,"").replace(/\u00e4/g,"ae").replace(/\u00f6/g,"oe")
      .replace(/\u00fc/g,"ue").replace(/\u00c4/g,"Ae").replace(/\u00d6/g,"Oe")
      .replace(/\u00dc/g,"Ue").replace(/\u00df/g,"ss").replace(/\u2013|\u2014/g,"-");
  }
  function hd(pre,txt,r,g,b){
    chk(12);st(r,g,b,9.5,true);
    var full=pre+" "+cl(txt);
    doc.text(full,ML,y);ss(r,g,b,0.4);doc.line(ML,y+1.8,ML+doc.getTextWidth(full),y+1.8);y+=8;
  }
  function fb(txt,fr,fg,fb2,br,bg2,bb,tr,tg,tb2,pad){
    pad=pad||4;
    var lines=doc.splitTextToSize(cl(txt),TW-pad*2-2);
    var bh=lines.length*5+pad+4;chk(bh+3);
    sf(fr,fg,fb2);ss(br,bg2,bb,0.25);doc.roundedRect(ML,y,TW,bh,2,2,"FD");
    st(tr,tg,tb2,8.5,false);lines.forEach(function(l,i){doc.text(l,ML+pad,y+pad+i*5);});y+=bh+4;
  }
  function ab(label,content,minH){
    minH=minH||16;chk(minH+12);
    st(139,148,158,8,true);doc.text(cl(label),ML,y);y+=4;
    var lines=content?doc.splitTextToSize(cl(content),TW-8):[];
    var bh=Math.max(minH,lines.length*5+7);chk(bh+4);
    sf(30,37,48);ss(48,54,61,0.25);doc.roundedRect(ML,y,TW,bh,2,2,"FD");
    if(content){st(220,230,240,8.5,false);lines.forEach(function(l,i){doc.text(l,ML+4,y+5+i*5);});}
    y+=bh+5;
  }
  function div(){chk(5);ss(48,54,61,0.2);doc.line(ML,y,MR,y);y+=6;}
  function qb(answers){
    if(!answers||!answers.length){st(139,148,158,8.5,false);doc.text("(Keine Antworten gespeichert)",ML,y);y+=7;return;}
