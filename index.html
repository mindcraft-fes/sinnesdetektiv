<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinnesdetektiv – Das Auge 👁️</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#1e2530;
  --border:#30363d; --accent:#58a6ff; --accent2:#3fb950;
  --accent3:#f78166; --accent4:#d2a8ff; --accent5:#ffa657;
  --text:#e6edf3; --text2:#8b949e; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── FULLSCREEN OVERLAY ── */
#imgOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;}
#imgOverlay.show{display:flex;}
#imgOverlay img{max-width:95vw;max-height:95vh;border-radius:12px;box-shadow:0 0 60px rgba(88,166,255,.3);}
#imgOverlay .close-hint{position:absolute;top:1rem;right:1.5rem;color:#8b949e;font-size:.9rem;}

/* ── START ── */
#startScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse at 30% 20%,#1a2744 0%,#0d1117 60%);text-align:center;}
.logo-circle{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#2d5a8e);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:1.5rem;box-shadow:0 0 40px rgba(88,166,255,.3);animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(88,166,255,.3)}50%{box-shadow:0 0 60px rgba(88,166,255,.5)}}
#startScreen h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,5vw,3rem);font-weight:800;background:linear-gradient(135deg,#58a6ff,#d2a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem;}
#startScreen p{color:var(--text2);margin-bottom:2rem;max-width:380px;line-height:1.6;}
.name-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;width:100%;max-width:400px;margin-bottom:1.5rem;}
.name-box label{display:block;font-weight:700;margin-bottom:.6rem;color:var(--accent);font-size:.95rem;}
.name-box input{width:100%;padding:.8rem 1rem;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;outline:none;transition:border-color .2s;}
.name-box input:focus{border-color:var(--accent);}
.name-box .class-row{display:flex;gap:.75rem;margin-top:.75rem;}
.name-box .class-row input{flex:1;}
.btn-primary{background:linear-gradient(135deg,#1f6feb,#388bfd);color:white;border:none;border-radius:12px;padding:.85rem 2.5rem;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(31,111,235,.4);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* ── CONTENT ── */
#contentScreen{display:none;min-height:100vh;padding:1.5rem 1rem 5rem;max-width:720px;margin:0 auto;}
.top-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.back-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.45rem .9rem;color:var(--text);font-family:'Nunito',sans-serif;cursor:pointer;font-size:.9rem;}
.prog-wrap{flex:1;background:var(--surface);border-radius:10px;height:8px;overflow:hidden;min-width:80px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent4));border-radius:10px;transition:width .4s ease;}
.prog-label{font-size:.8rem;color:var(--text2);white-space:nowrap;}
.module-tag{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);border-radius:20px;padding:.3rem .8rem;font-size:.8rem;color:var(--accent);font-weight:700;}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;margin-bottom:1rem;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.step-badge{display:inline-flex;align-items:center;gap:.35rem;background:var(--surface2);border-radius:20px;padding:.25rem .85rem;font-size:.78rem;font-weight:700;color:var(--accent);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.04em;}
.card h3{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.2rem;margin-bottom:1rem;}
.card p,.card li{line-height:1.8;color:var(--text2);margin-bottom:.4rem;}
.card strong{color:var(--text);}
.card ul,.card ol{padding-left:1.2rem;margin:.5rem 0;}
.info-box{background:rgba(88,166,255,.07);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:.75rem 1rem;margin:.75rem 0;color:var(--text2);font-size:.93rem;}
.warn-box{background:rgba(255,166,87,.07);border-left:3px solid var(--accent5);border-radius:0 8px 8px 0;padding:.75rem 1rem;margin:.75rem 0;color:var(--text2);font-size:.93rem;}
.success-box{background:rgba(63,185,80,.07);border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;padding:.75rem 1rem;margin:.75rem 0;color:var(--text2);font-size:.93rem;}

/* ── IMAGE ── */
.img-container{margin:1.25rem 0;text-align:center;}
.img-container img{max-width:100%;border-radius:10px;cursor:zoom-in;border:1px solid var(--border);transition:transform .2s,box-shadow .2s;}
.img-container img:hover{transform:scale(1.01);box-shadow:0 4px 24px rgba(88,166,255,.2);}
.img-hint{font-size:.78rem;color:var(--text2);margin-top:.4rem;}

/* ── VIDEO ── */
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;margin:1rem 0;border:1px solid var(--border);}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;}

/* ── ZUORDNUNG ── */
.zuordnung-area{display:flex;flex-direction:column;gap:1rem;margin:1rem 0;}
.term-pool{display:flex;flex-wrap:wrap;gap:.5rem;padding:1rem;background:var(--surface2);border-radius:10px;border:1px solid var(--border);min-height:50px;}
.term-pool-label{font-size:.8rem;color:var(--text2);margin-bottom:.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.term-chip{background:var(--surface);border:1.5px solid var(--accent);border-radius:20px;padding:.35rem .85rem;font-size:.88rem;cursor:pointer;transition:all .2s;user-select:none;color:var(--accent);}
.term-chip:hover{background:rgba(88,166,255,.12);}
.term-chip.selected{background:rgba(88,166,255,.2);box-shadow:0 0 0 2px var(--accent);}
.term-chip.used{opacity:.25;cursor:not-allowed;pointer-events:none;}
.slots-list{display:flex;flex-direction:column;gap:.5rem;}
.slot-row{display:flex;align-items:center;gap:.75rem;background:var(--surface2);border-radius:8px;padding:.6rem .85rem;border:2px dashed var(--border);cursor:pointer;transition:all .2s;font-size:.9rem;}
.slot-row:hover{border-color:var(--accent);}
.slot-row.correct{border-color:var(--accent2);background:rgba(63,185,80,.08);border-style:solid;}
.slot-row.wrong{border-color:var(--accent3);background:rgba(247,129,102,.08);border-style:solid;}
.slot-num{font-size:.78rem;font-weight:700;color:var(--text2);min-width:18px;}
.slot-label{flex:1;color:var(--text2);font-size:.85rem;}
.slot-value{font-weight:700;font-size:.9rem;}

/* ── QUIZ ── */
.quiz-q{font-weight:700;font-size:1rem;margin-bottom:.85rem;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:.5rem;}
.opt-btn{background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:.8rem 1rem;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-size:.93rem;cursor:pointer;transition:all .15s;line-height:1.4;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(88,166,255,.07);}
.opt-btn.correct{border-color:var(--accent2);background:rgba(63,185,80,.1);color:var(--accent2);}
.opt-btn.wrong{border-color:var(--accent3);background:rgba(247,129,102,.1);color:var(--accent3);}
.fb{margin-top:.6rem;padding:.65rem .9rem;border-radius:8px;font-weight:600;font-size:.9rem;display:none;}
.fb.show{display:block;}
.fb.correct{background:rgba(63,185,80,.08);color:var(--accent2);border:1px solid var(--accent2);}
.fb.wrong{background:rgba(247,129,102,.08);color:var(--accent3);border:1px solid var(--accent3);}

/* ── EXPERIMENT ── */
.exp-phase{margin-bottom:1.5rem;}
.phase-title{font-weight:800;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem;}

/* Checklist */
.checklist{display:flex;flex-direction:column;gap:.5rem;margin:.5rem 0;}
.check-item{display:flex;align-items:flex-start;gap:.75rem;padding:.7rem .85rem;background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .2s;}
.check-item.done{background:rgba(63,185,80,.06);border-color:rgba(63,185,80,.3);}
.check-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent2);cursor:pointer;flex-shrink:0;margin-top:2px;}
.check-item .step-text{color:var(--text2);font-size:.92rem;line-height:1.55;}
.check-item.done .step-text{color:var(--text2);opacity:.7;}
.check-item strong{color:var(--text);}

/* Helper words */
.helper-words{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 .75rem;}
.helper-word{background:rgba(210,168,255,.08);border:1px solid rgba(210,168,255,.25);border-radius:6px;padding:.25rem .65rem;font-size:.82rem;color:var(--accent4);cursor:pointer;transition:all .2s;}
.helper-word:hover{background:rgba(210,168,255,.15);}

/* Textarea */
.field-wrap{margin:.5rem 0;}
.field-wrap label{display:block;font-size:.85rem;font-weight:700;color:var(--text2);margin-bottom:.4rem;}
.field-wrap textarea{width:100%;padding:.75rem .9rem;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:.93rem;resize:vertical;min-height:80px;outline:none;transition:border-color .2s;line-height:1.6;}
.field-wrap textarea:focus{border-color:var(--accent);}
.field-wrap .hint{font-size:.78rem;color:var(--text2);margin-top:.25rem;font-style:italic;}

/* Hypothesis shown */
.hyp-display{background:rgba(210,168,255,.06);border:1px solid rgba(210,168,255,.2);border-radius:10px;padding:1rem 1.1rem;margin:.75rem 0;}
.hyp-display .hyp-label{font-size:.78rem;font-weight:700;color:var(--accent4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.35rem;}
.hyp-display .hyp-text{color:var(--text2);font-style:italic;line-height:1.6;}

/* Unlock animation */
.unlock-reveal{animation:unlockPop .4s ease;}
@keyframes unlockPop{0%{opacity:0;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}

/* BUTTONS */
.btn-save{background:linear-gradient(135deg,#1f6feb,#388bfd);color:white;border:none;border-radius:10px;padding:.65rem 1.5rem;font-family:'Nunito',sans-serif;font-size:.93rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:.6rem;}
.btn-save:hover{transform:translateY(-1px);}
.btn-next{background:linear-gradient(135deg,#238636,#2ea043);color:white;border:none;border-radius:10px;padding:.75rem 1.75rem;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-next:hover{transform:translateY(-1px);}
.btn-pdf{background:linear-gradient(135deg,#6e40c9,#8957e5);color:white;border:none;border-radius:10px;padding:.75rem 1.75rem;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.5rem;}
.btn-pdf:hover{transform:translateY(-1px);}
.nav-row{display:flex;gap:.75rem;margin-top:1.25rem;flex-wrap:wrap;align-items:center;}

/* COMPLETION */
.completion-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--accent2);border-radius:var(--radius);padding:2.5rem;text-align:center;}
.completion-card .big-icon{font-size:4rem;margin-bottom:1rem;}
.completion-card h2{font-family:'Outfit',sans-serif;font-size:1.75rem;font-weight:800;margin-bottom:.5rem;}
.score-ring{font-size:3rem;font-weight:900;font-family:'Outfit',sans-serif;color:var(--accent2);}

/* ── REFLECTION ── */
.reflect-grid{display:flex;flex-direction:column;gap:.75rem;margin:.75rem 0;}
.reflect-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
.reflect-row label{flex:1;min-width:180px;color:var(--text2);font-size:.93rem;}
.star-row{display:flex;gap:.3rem;}
.star{font-size:1.4rem;cursor:pointer;transition:transform .1s;filter:grayscale(1) opacity(.4);}
.star.on{filter:none;}
.star:hover{transform:scale(1.2);}

@media(max-width:500px){.card{padding:1.2rem;}.check-item{padding:.6rem .7rem;}}
</style>
</head>
<body>

<!-- FULLSCREEN IMG -->
<div id="imgOverlay" onclick="closeImg()">
  <span class="close-hint">✕ Tippen zum Schließen</span>
  <img id="overlayImg" src="" alt="">
</div>

<!-- ══ START ══ -->
<div id="startScreen">
  <div class="logo-circle">👁️</div>
  <h1>Das Auge</h1>
  <p>Entdecke Aufbau, Funktion und das Geheimnis des blinden Flecks</p>
  <div class="name-box">
    <label>Dein Name</label>
    <input type="text" id="nameInput" placeholder="Vorname Nachname" maxlength="40">
    <div class="class-row">
      <input type="text" id="classInput" placeholder="Klasse (z.B. 5b)" maxlength="10">
      <input type="date" id="dateInput">
    </div>
  </div>
  <button class="btn-primary" id="startBtn" disabled onclick="startModule()">Los geht's →</button>
</div>

<!-- ══ CONTENT ══ -->
<div id="contentScreen">
  <div class="top-header">
    <span class="module-tag">👁️ Das Auge</span>
    <div class="prog-wrap"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <span class="prog-label" id="progLabel">0/8</span>
  </div>
  <div id="stepContainer"></div>
</div>

<script>
// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let studentName = "", studentClass = "", studentDate = "";
let stepIdx = 0, totalScore = 0;
let savedData = {
  hypothese: "", beobachtung: "", fazit: "",
  reflection: {verstanden:0, spass:0, schwierig:0},
  quizScores: []
};

const nameInput = document.getElementById("nameInput");
const classInput = document.getElementById("classInput");
const dateInput = document.getElementById("dateInput");
const startBtn = document.getElementById("startBtn");

// Set today's date
dateInput.valueAsDate = new Date();

nameInput.addEventListener("input", checkStart);
nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter") startModule(); });

function checkStart() {
  startBtn.disabled = nameInput.value.trim().length < 2;
}

function startModule() {
  studentName = nameInput.value.trim();
  studentClass = classInput.value.trim() || "–";
  studentDate = dateInput.value || new Date().toLocaleDateString("de-DE");
  if(studentName.length < 2) return;
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("contentScreen").style.display = "block";
  renderStep();
}

// ═══════════════════════════════════════
//  STEPS DEFINITION
// ═══════════════════════════════════════
const STEPS = [
  { id: "text1",       label: "📖 Sachtext 1", title: "Aufbau des Auges" },
  { id: "zuordnung",   label: "🏷️ Zuordnung",  title: "Beschrifte das Auge" },
  { id: "quiz1",       label: "❓ Fragen",      title: "Fragen zum Aufbau" },
  { id: "video",       label: "🎬 Video",       title: "So funktioniert das Sehen" },
  { id: "quiz2",       label: "❓ Fragen",      title: "Fragen zum Video" },
  { id: "exp_intro",   label: "🔬 Experiment",  title: "Vorbereitung: Der blinde Fleck" },
  { id: "exp_main",    label: "🔬 Experiment",  title: "Durchführung & Beobachtung" },
  { id: "exp_explain", label: "💡 Erklärung",   title: "Was steckt dahinter?" },
  { id: "reflection",  label: "✅ Abschluss",   title: "Reflexion & PDF" },
];

const TOTAL = STEPS.length;

function updateProgress() {
  const pct = Math.round((stepIdx / TOTAL) * 100);
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("progLabel").textContent = stepIdx + "/" + TOTAL;
}

function nextStep() {
  stepIdx++;
  renderStep();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderStep() {
  updateProgress();
  if(stepIdx >= TOTAL) { renderCompletion(); return; }
  const step = STEPS[stepIdx];
  const c = document.getElementById("stepContainer");
  c.innerHTML = "";
  switch(step.id) {
    case "text1":       renderText1(c); break;
    case "zuordnung":   renderZuordnung(c); break;
    case "quiz1":       renderQuiz1(c); break;
    case "video":       renderVideo(c); break;
    case "quiz2":       renderQuiz2(c); break;
    case "exp_intro":   renderExpIntro(c); break;
    case "exp_main":    renderExpMain(c); break;
    case "exp_explain": renderExpExplain(c); break;
    case "reflection":  renderReflection(c); break;
  }
}

// ═══════════════════════════════════════
//  STEP 1 – SACHTEXT 1 (AUFBAU)
// ═══════════════════════════════════════
function renderText1(c) {
  c.innerHTML = `
  <div class="card">
    <div class="step-badge">📖 Sachtext 1 – Aufbau des Auges</div>
    <h3>Wie ist unser Auge aufgebaut?</h3>

    <p>Das Auge ist unser wichtigstes Sinnesorgan – es ermöglicht uns zu sehen. Schau dir das Schaubild unten genau an, während du den Text liest.</p>

    <div class="img-container">
      <img src="AufbauAuge.jpg" alt="Schematischer Aufbau des Auges" onclick="openImg(this.src)" title="Klicken für Vollbild">
      <div class="img-hint">🔍 Auf das Bild klicken für Vollbild</div>
    </div>

    <p>Von außen erkennst du zunächst die <strong>Hornhaut</strong> – eine durchsichtige, gewölbte Schutzschicht ganz vorne am Auge. Dahinter liegt die farbige <strong>Iris</strong> (Regenbogenhaut), die deine Augenfarbe bestimmt. In ihrer Mitte befindet sich die <strong>Pupille</strong> – das ist die schwarze Öffnung, durch die Licht ins Auge gelangt. Die Iris kann die Pupille vergrößern oder verkleinern – je nachdem, wie viel Licht vorhanden ist.</p>

    <p>Hinter der Pupille liegt die <strong>Linse</strong>. Sie bündelt das Licht und schickt es auf die <strong>Netzhaut</strong> (Retina) auf der Rückseite des Auges. Auf der Netzhaut sitzen Millionen von Sinneszellen: die <strong>Stäbchen</strong> (für Hell-Dunkel-Sehen) und die <strong>Zapfen</strong> (für das Farbsehen).</p>

    <p>Die Signale der Netzhaut werden über den <strong>Sehnerv</strong> ans <strong>Gehirn</strong> geleitet. Erst dort, in der Schaltzentrale unseres Körpers, entsteht das vollständige Bild, das wir bewusst wahrnehmen. Ohne Gehirn wären all die Signale des Auges nutzlos!</p>

    <div class="info-box">💡 <strong>Wusstest du?</strong> Das Auge ist nur ca. 24 mm groß – enthält aber über 130 Millionen Sinneszellen auf der Netzhaut!</div>

    <p>Auch außen ist das Auge geschützt: Das <strong>Augenlid</strong> schließt sich reflexartig, wenn etwas auf das Auge zufliegt. Die <strong>Tränenflüssigkeit</strong> hält die Augenoberfläche feucht, sauber und keimfrei.</p>

    <div class="warn-box">🤔 <strong>Denke schon mal nach:</strong> An einer bestimmten Stelle verlässt der Sehnerv das Auge – dort können keine Sinneszellen sitzen. Was könnte das für unser Sehen bedeuten? Du wirst es im Experiment selbst herausfinden!</div>

    <div class="success-box">👁️ <strong>Alltagsbeispiel:</strong> Wenn du nachts ins Dunkle gehst, werden deine Pupillen größer – die Iris öffnet sich weit, um möglichst viel Licht hereinzulassen. Gehst du dann wieder in ein helles Zimmer, kneifen die Augen zunächst: Die Iris zieht sich zusammen. Das gleiche Prinzip steckt hinter dem Experiment, das dich am Ende dieses Moduls erwartet!</div>

    <div class="nav-row">
      <button class="btn-next" onclick="nextStep()">Weiter zur Zuordnung →</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════
//  STEP 2 – ZUORDNUNG
// ═══════════════════════════════════════
function renderZuordnung(c) {
  const terms = ["Hornhaut","Iris","Pupille","Linse","Netzhaut","Sehnerv","Stäbchen & Zapfen","Gehirn"];
  const slots = [
    {id:"s1", label:"Äußere durchsichtige Schutzschicht", answer:"Hornhaut"},
    {id:"s2", label:"Farbiger Ringmuskel – bestimmt die Augenfarbe", answer:"Iris"},
    {id:"s3", label:"Schwarze Öffnung, durch die Licht ins Auge fällt", answer:"Pupille"},
    {id:"s4", label:"Bündelt das Licht auf die Netzhaut", answer:"Linse"},
    {id:"s5", label:"Innenauskleidung mit Millionen Sinneszellen", answer:"Netzhaut"},
    {id:"s6", label:"Leitet Signale vom Auge zum Gehirn", answer:"Sehnerv"},
    {id:"s7", label:"Sinneszellen für Hell/Dunkel und Farben", answer:"Stäbchen & Zapfen"},
    {id:"s8", label:"Verarbeitet die Signale und erzeugt das Bild", answer:"Gehirn"},
  ];

  let sel = null, filled = {}, used = {};

  function render() {
    c.innerHTML = `
    <div class="card">
      <div class="step-badge">🏷️ Zuordnungsaufgabe</div>
      <h3>Was gehört wohin?</h3>
      <p style="color:var(--text2);margin-bottom:1rem">

      </p>

      <div class="img-container">
        <img src="Zuordnung.jpg" alt="Auge Zuordnung" onclick="openImg(this.src)" style="max-height:280px;object-fit:contain;" title="Klicken für Vollbild – nutze das Bild als Hilfe!">
        <div class="img-hint">🔍 Klicke auf das Bild für eine größere Ansicht – es hilft beim Zuordnen!</div>
      </div>

      <div class="zuordnung-area">
        <div>
          <div class="term-pool-label">📦 Begriffe zum Zuordnen</div>
          <div class="term-pool">
            ${terms.map(t=>`<div class="term-chip ${sel===t?'selected':''} ${used[t]?'used':''}" onclick="__zsel('${t}')">${t}</div>`).join('')}
          </div>
        </div>
        <div class="slots-list">
          ${slots.map((s,i)=>{
            const v=filled[s.id], ok=v&&v===s.answer, bad=v&&v!==s.answer;
            return `<div class="slot-row ${ok?'correct':bad?'wrong':''}" onclick="__zdrop('${s.id}')">
              <span class="slot-num">${i+1}</span>
              <span class="slot-label">${s.label}</span>
              <span class="slot-value">${v ? v+' '+(ok?'✓':bad?'✗':'') : '<span style="color:var(--border)">— klicken —</span>'}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div id="zfb" style="margin-top:.75rem"></div>
      <div class="nav-row">
        <button class="btn-save" onclick="__zcheck()">Überprüfen ✓</button>
      </div>
    </div>`;
  }

  window.__zsel = t => { if(used[t]) return; sel = sel===t ? null : t; render(); };
  window.__zdrop = id => {
    if(!sel) return;
    Object.keys(filled).forEach(k=>{ if(filled[k]===sel) delete filled[k]; });
    filled[id] = sel;
    terms.forEach(t=>{ used[t] = Object.values(filled).includes(t); });
    sel = null; render();
  };
  window.__zcheck = () => {
    let ok = 0;
    slots.forEach(s=>{ if(filled[s.id]===s.answer) ok++; });
    const fb = document.getElementById("zfb");
    if(ok === slots.length) {
      fb.innerHTML = `<div class="fb correct show">🎉 Perfekt! Alle ${slots.length} Begriffe richtig zugeordnet!</div>`;
      totalScore += slots.length;
      setTimeout(()=>nextStep(), 1600);
    } else {
      slots.forEach(s=>{if(filled[s.id]&&filled[s.id]!==s.answer){used[filled[s.id]]=false;delete filled[s.id];}});
      render();
      document.getElementById("zfb").innerHTML=`<div class="fb wrong show">${ok}/${slots.length} richtig – falsche Felder zurückgesetzt. Schau nochmal ins Bild und versuche es erneut!</div>`;
    }
  };
  render();
}

// ═══════════════════════════════════════
//  GENERIC QUIZ RUNNER
// ═══════════════════════════════════════
function runQuiz(c, label, qs, quizId) {
  let qi = 0, correct = 0;
  function rq() {
    if(qi >= qs.length) {
      totalScore += correct;
      savedData.quizScores[quizId] = `${correct}/${qs.length}`;
      c.innerHTML = `<div class="card">
        <div class="step-badge">${label}</div>
        <div style="text-align:center;padding:1rem 0">
          <div style="font-size:2.5rem;margin-bottom:.5rem">${correct===qs.length?'🎉':'👍'}</div>
          <h3>${correct}/${qs.length} Fragen richtig</h3>
          <p style="color:var(--text2);margin-top:.4rem">${correct===qs.length?'Perfekt!':'Gut gemacht – weiter geht\'s!'}</p>
        </div>
        <div class="nav-row"><button class="btn-next" onclick="nextStep()">Weiter →</button></div>
      </div>`;
      return;
    }
    const q = qs[qi];
    c.innerHTML = `<div class="card">
      <div class="step-badge">${label} (${qi+1}/${qs.length})</div>
      <div class="quiz-q">${q.q}</div>
      <div class="options">${q.opts.map((o,i)=>`<button class="opt-btn" onclick="__qa(${i})">${o}</button>`).join('')}</div>
      <div class="fb" id="qfb"></div>
    </div>`;
  }
  window.__qa = idx => {
    const q = qs[qi];
    document.querySelectorAll(".opt-btn").forEach(b=>b.disabled=true);
    document.querySelectorAll(".opt-btn")[idx].classList.add(idx===q.c?"correct":"wrong");
    document.querySelectorAll(".opt-btn")[q.c].classList.add("correct");
    const fb = document.getElementById("qfb");
    fb.textContent = q.fb; fb.className = `fb show ${idx===q.c?"correct":"wrong"}`;
    if(idx===q.c) correct++;
    setTimeout(()=>{ qi++; rq(); }, 2200);
  };
  rq();
}

// ═══════════════════════════════════════
//  COMPLETION
// ═══════════════════════════════════════
function renderCompletion() {
  updateProgress();
  document.getElementById("progFill").style.width = "100%";
  document.getElementById("progLabel").textContent = TOTAL + "/" + TOTAL;

  document.getElementById("stepContainer").innerHTML = `
  <div class="completion-card">
    <div class="big-icon">👁️</div>
    <h2>Modul abgeschlossen!</h2>
    <p style="color:var(--text2);margin-bottom:1.5rem">Super gemacht, ${studentName}!</p>
    <div style="background:var(--surface2);border-radius:12px;padding:1.25rem;margin-bottom:1.5rem">
      <div class="score-ring">${totalScore}</div>
      <div style="color:var(--text2);font-size:.9rem;margin-top:.25rem">Punkte gesamt</div>
    </div>
    <p style="color:var(--text2);margin-bottom:1.5rem">Lade jetzt dein ausgefülltes Protokoll als PDF herunter – für deine Mappe!</p>
    <div class="nav-row" style="justify-content:center">
      <button class="btn-pdf" onclick="generatePDF()">📄 Protokoll als PDF herunterladen</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════
//  HELPER: INSERT WORD INTO TEXTAREA
// ═══════════════════════════════════════
function insertHelper(textareaId, word) {
  const ta = document.getElementById(textareaId);
  if(!ta) return;
  const pos = ta.selectionStart;
  const before = ta.value.substring(0, pos);
  const after = ta.value.substring(pos);
  const sep = before.length > 0 && !before.endsWith(" ") ? " " : "";
  ta.value = before + sep + word + " " + after;
  ta.selectionStart = ta.selectionEnd = pos + sep.length + word.length + 1;
  ta.focus();
}

// ═══════════════════════════════════════
//  IMAGE FULLSCREEN
// ═══════════════════════════════════════
function openImg(src) {
  document.getElementById("overlayImg").src = src;
  document.getElementById("imgOverlay").classList.add("show");
}
function closeImg() {
  document.getElementById("imgOverlay").classList.remove("show");
}

// ═══════════════════════════════════════
//  PDF GENERATION
// ═══════════════════════════════════════
function generatePDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  
  const W = 210, H = 297;
  const margin = 20, textW = W - 2*margin;
  let y = 20;

  // Helper functions
  function checkPage(needed = 12) {
    if(y + needed > H - 15) { doc.addPage(); y = 20; }
  }

  function hline(col = [48, 54, 61]) {
    doc.setDrawColor(...col);
    doc.setLineWidth(0.3);
    doc.line(margin, y, W-margin, y);
    y += 4;
  }

  function box(text, bgR, bgG, bgB, textColor=[230,237,243]) {
    const lines = doc.splitTextToSize(text, textW - 10);
    const bh = lines.length * 5 + 8;
    checkPage(bh + 4);
    doc.setFillColor(bgR, bgG, bgB);
    doc.roundedRect(margin, y, textW, bh, 3, 3, 'F');
    doc.setTextColor(...textColor);
    doc.setFontSize(9.5);
    doc.setFont("helvetica","normal");
    lines.forEach((l,i) => { doc.text(l, margin+5, y+6+i*5); });
    y += bh + 5;
  }

  function sectionTitle(icon, text, r=88, g=166, b=255) {
    checkPage(14);
    doc.setFillColor(r, g, b, 0.15);
    doc.setTextColor(r, g, b);
    doc.setFontSize(10);
    doc.setFont("helvetica","bold");
    doc.text(icon + " " + text, margin, y);
    y += 2;
    doc.setDrawColor(r, g, b);
    doc.setLineWidth(0.5);
    doc.line(margin, y, margin + doc.getTextWidth(icon + " " + text), y);
    y += 6;
    doc.setTextColor(180, 188, 198);
    doc.setFont("helvetica","normal");
  }

  function textBlock(text, bold=false, size=9.5, color=[180,188,198]) {
    doc.setTextColor(...color);
    doc.setFontSize(size);
    doc.setFont("helvetica", bold?"bold":"normal");
    const lines = doc.splitTextToSize(text, textW);
    lines.forEach(l => { checkPage(7); doc.text(l, margin, y); y += 5; });
    y += 2;
  }

  function answerBox(label, content, filled=true) {
    checkPage(24);
    doc.setTextColor(139,148,158);
    doc.setFontSize(8.5);
    doc.setFont("helvetica","bold");
    doc.text(label, margin, y); y += 4;
    const lines = content ? doc.splitTextToSize(content, textW - 6) : [];
    const bh = Math.max(20, lines.length * 5 + 8);
    checkPage(bh + 4);
    doc.setFillColor(30, 37, 48);
    doc.setDrawColor(48, 54, 61);
    doc.setLineWidth(0.3);
    doc.roundedRect(margin, y, textW, bh, 2, 2, filled ? 'FD' : 'D');
    if(content) {
      doc.setTextColor(230, 237, 243);
      doc.setFontSize(9.5);
      doc.setFont("helvetica","normal");
      lines.forEach((l,i) => doc.text(l, margin+4, y+5+i*5));
    }
    y += bh + 5;
  }

  // ── HEADER ──
  doc.setFillColor(13, 17, 23);
  doc.rect(0, 0, W, H, 'F');

  doc.setFillColor(22, 27, 34);
  doc.roundedRect(margin-5, y-5, textW+10, 38, 4, 4, 'F');
  doc.setDrawColor(88, 166, 255);
  doc.setLineWidth(0.5);
  doc.roundedRect(margin-5, y-5, textW+10, 38, 4, 4, 'S');

  doc.setTextColor(88, 166, 255);
  doc.setFontSize(18);
  doc.setFont("helvetica","bold");
  doc.text("👁️  Sinnesdetektiv – Das Auge", margin, y+8);

  doc.setTextColor(139, 148, 158);
  doc.setFontSize(9);
  doc.setFont("helvetica","normal");
  doc.text(`Name: ${studentName}   |   Klasse: ${studentClass}   |   Datum: ${studentDate}`, margin, y+16);
  doc.text(`Punkte: ${totalScore}`, margin, y+22);

  y += 42;

  // ── FRAGESTELLUNG ──
  sectionTitle("🔍","Fragestellung", 88, 166, 255);
  box("Hat unser Auge eine Stelle, an der es nichts sieht – obwohl das Auge offen ist?", 22, 27, 34, [230,237,243]);

  // ── HYPOTHESE ──
  sectionTitle("💭","Meine Hypothese", 210, 168, 255);
  answerBox("Was habe ich vermutet?", savedData.hypothese || "");

  // ── MATERIAL & VERSUCHSAUFBAU ──
  sectionTitle("🧰","Material & Versuchsaufbau", 255, 166, 87);
  textBlock("• Ein Blatt Papier (weiß, DIN A4)   • Ein Stift");
  box("✏️  Zeichne: Links ein großes + und rechts einen großen ●, Abstand ca. 15 cm", 30, 37, 48, [255,166,87]);

  // ── DURCHFÜHRUNG ──
  sectionTitle("⚗️","Durchführung", 255, 166, 87);
  const steps = [
    "Halte das Blatt in Armabstand.",
    "Schließe das rechte Auge.",
    "Schaue mit dem linken Auge fest auf das +.",
    "Bewege das Blatt langsam auf dich zu – Blick bleibt auf dem +!",
    "Beobachte, was mit dem ● passiert.",
  ];
  steps.forEach((s,i) => {
    checkPage(8);
    doc.setFillColor(30, 37, 48);
    doc.roundedRect(margin, y, textW, 7, 1.5, 1.5, 'F');
    doc.setTextColor(255,166,87);
    doc.setFontSize(8.5);
    doc.setFont("helvetica","bold");
    doc.text(`${i+1}`, margin+3, y+5);
    doc.setTextColor(180,188,198);
    doc.setFont("helvetica","normal");
    doc.text(s, margin+12, y+5);
    y += 9;
  });
  y += 3;

  // ── BEOBACHTUNG ──
  checkPage(30);
  sectionTitle("👁️","Meine Beobachtung", 88, 166, 255);
  answerBox("Was habe ich beobachtet?", savedData.beobachtung || "");

  // ── ERKLÄRUNG ──
  sectionTitle("💡","Erklärung", 63, 185, 80);
  box("An der Stelle, wo der Sehnerv aus dem Auge tritt (Sehnervkopf), gibt es keine Sinneszellen – das ist der blinde Fleck. Das Gehirn füllt diese Lücke automatisch auf, sodass wir sie im Alltag nicht bemerken.", 22, 27, 34, [230,237,243]);

  // ── HYPOTHESE PRÜFEN ──
  checkPage(30);
  sectionTitle("🔎","Hypothese prüfen", 210, 168, 255);
  textBlock("Ursprüngliche Hypothese:", true, 9, [180,188,198]);
  box(`"${savedData.hypothese || "–"}"`, 30, 25, 45, [210,168,255]);
  answerBox("Begründung – war meine Hypothese richtig?", savedData.fazit || "");

  // ── REFLEXION ──
  checkPage(40);
  sectionTitle("✅","Reflexion", 63, 185, 80);
  const refLabels = {verstanden:"Ich habe den Aufbau des Auges verstanden", spass:"Das Experiment hat mir Spaß gemacht", schwierig:"Die Aufgaben waren gut zu schaffen"};
  Object.entries(refLabels).forEach(([key, label]) => {
    const val = savedData.reflection[key] || 0;
    checkPage(10);
    doc.setTextColor(139,148,158); doc.setFontSize(8.5); doc.setFont("helvetica","normal");
    doc.text(label + ":", margin, y);
    const stars = "★".repeat(val) + "☆".repeat(5-val);
    doc.setTextColor(255, 166, 87);
    doc.setFontSize(11);
    doc.text(stars, W - margin - doc.getTextWidth(stars)*0.75, y);
    y += 7;
  });

  // ── FOOTER ──
  doc.setTextColor(48, 54, 61);
  doc.setFontSize(8);
  doc.setFont("helvetica","normal");
  doc.text("Sinnesdetektiv – Biologie Klasse 5/6  |  mindcraft-fes", margin, H-8);
  doc.text(`Seite 1`, W-margin, H-8, {align:"right"});

  // ── SAVE ──
  const fname = `Sinnesdetektiv_Auge_${studentName.replace(/\s+/g,'_')}_${studentClass}.pdf`;
  doc.save(fname);
}
</script>
