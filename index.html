<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinnesdetektiv – Das Auge</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinnesdetektiv">
<link rel="apple-touch-icon" href="SinnesLogo.png">
<meta name="theme-color" content="#0d1117">
<meta property="og:title" content="Sinnesdetektiv – Das Auge">
<meta property="og:description" content="Entdecke Aufbau und Funktion des Auges">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1e2530;
  --border:#30363d;--accent:#58a6ff;--accent2:#3fb950;
  --accent3:#f78166;--accent4:#d2a8ff;--accent5:#ffa657;
  --text:#e6edf3;--text2:#8b949e;--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* FULLSCREEN */
#imgOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;}
#imgOverlay.show{display:flex;}
#imgOverlay img{max-width:95vw;max-height:95vh;border-radius:10px;}
#imgOverlay .close-x{position:absolute;top:1rem;right:1.5rem;color:#8b949e;font-size:1rem;pointer-events:none;}

/* START */
#startScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse at 30% 20%,#1a2744,#0d1117);text-align:center;}
.logo-circle{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#2d5a8e);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:2.8rem;margin-bottom:1.25rem;box-shadow:0 0 40px rgba(88,166,255,.3);animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 35px rgba(88,166,255,.3)}50%{box-shadow:0 0 55px rgba(88,166,255,.5)}}
#startScreen h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,5vw,3rem);font-weight:800;background:linear-gradient(135deg,#58a6ff,#d2a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.4rem;}
#startScreen>p{color:var(--text2);margin-bottom:1.75rem;max-width:360px;line-height:1.6;}
.name-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;width:100%;max-width:400px;margin-bottom:1.25rem;}
.name-box label{display:block;font-weight:700;margin-bottom:.5rem;color:var(--accent);font-size:.9rem;}
.name-box input{width:100%;padding:.75rem 1rem;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;}
.name-box input:focus{border-color:var(--accent);}
.class-row{display:flex;gap:.6rem;margin-top:.6rem;}
.class-row input{flex:1;}
.btn-primary{background:linear-gradient(135deg,#1f6feb,#388bfd);color:white;border:none;border-radius:12px;padding:.8rem 2.5rem;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(31,111,235,.4);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* CONTENT */
#contentScreen{display:none;min-height:100vh;padding:1.25rem 1rem 5rem;max-width:700px;margin:0 auto;}
.top-bar{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.mod-tag{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.25);border-radius:20px;padding:.25rem .75rem;font-size:.78rem;color:var(--accent);font-weight:700;}
.prog-wrap{flex:1;background:var(--surface);border-radius:10px;height:7px;overflow:hidden;min-width:80px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent4));border-radius:10px;transition:width .4s;}
.prog-lbl{font-size:.78rem;color:var(--text2);}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;margin-bottom:.85rem;animation:fadeUp .28s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-flex;align-items:center;gap:.3rem;background:var(--surface2);border-radius:20px;padding:.22rem .8rem;font-size:.76rem;font-weight:700;color:var(--accent);margin-bottom:.9rem;text-transform:uppercase;letter-spacing:.04em;}
.card h3{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.15rem;margin-bottom:.9rem;}
.card p,.card li{line-height:1.8;color:var(--text2);margin-bottom:.35rem;}
.card strong{color:var(--text);}
.card ul,.card ol{padding-left:1.15rem;margin:.4rem 0;}
.info-box{background:rgba(88,166,255,.07);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:.65rem .9rem;margin:.65rem 0;color:var(--text2);font-size:.91rem;}
.warn-box{background:rgba(255,166,87,.07);border-left:3px solid var(--accent5);border-radius:0 8px 8px 0;padding:.65rem .9rem;margin:.65rem 0;color:var(--text2);font-size:.91rem;}
.success-box{background:rgba(63,185,80,.07);border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;padding:.65rem .9rem;margin:.65rem 0;color:var(--text2);font-size:.91rem;}

/* IMG */
.img-wrap{margin:1.1rem 0;text-align:center;}
.img-wrap img{max-width:100%;border-radius:10px;cursor:zoom-in;border:1px solid var(--border);transition:transform .2s,box-shadow .2s;}
.img-wrap img:hover{transform:scale(1.01);box-shadow:0 4px 20px rgba(88,166,255,.18);}
.img-hint{font-size:.75rem;color:var(--text2);margin-top:.35rem;}

/* VIDEO */
.vid-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;margin:1rem 0;border:1px solid var(--border);}
.vid-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;}

/* ZUORDNUNG */
.term-pool-lbl{font-size:.76rem;color:var(--text2);margin-bottom:.4rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.term-pool{display:flex;flex-wrap:wrap;gap:.4rem;padding:.85rem;background:var(--surface2);border-radius:10px;border:1px solid var(--border);min-height:46px;margin-bottom:.85rem;}
.chip{background:var(--surface);border:1.5px solid var(--accent);border-radius:20px;padding:.32rem .8rem;font-size:.85rem;cursor:pointer;transition:all .18s;color:var(--accent);user-select:none;}
.chip:hover{background:rgba(88,166,255,.1);}
.chip.sel{background:rgba(88,166,255,.18);box-shadow:0 0 0 2px var(--accent);}
.chip.used{opacity:.22;cursor:not-allowed;pointer-events:none;}
.slot{display:flex;align-items:center;gap:.65rem;background:var(--surface2);border-radius:8px;padding:.55rem .8rem;border:2px dashed var(--border);cursor:pointer;transition:all .18s;font-size:.88rem;margin-bottom:.4rem;}
.slot:hover{border-color:var(--accent);}
.slot.ok{border-color:var(--accent2);background:rgba(63,185,80,.07);border-style:solid;}
.slot.bad{border-color:var(--accent3);background:rgba(247,129,102,.07);border-style:solid;}
.slot-n{font-size:.75rem;font-weight:700;color:var(--text2);min-width:16px;}
.slot-lbl{flex:1;color:var(--text2);font-size:.82rem;}
.slot-val{font-weight:700;font-size:.87rem;}

/* QUIZ */
.q-txt{font-weight:700;font-size:.98rem;margin-bottom:.8rem;line-height:1.5;}
.opts{display:flex;flex-direction:column;gap:.45rem;}
.opt{background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:.75rem 1rem;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-size:.91rem;cursor:pointer;transition:all .15s;line-height:1.45;width:100%;}
.opt:hover:not(:disabled){border-color:var(--accent);background:rgba(88,166,255,.06);}
/* Correct answer expands */
.opt.correct{border-color:var(--accent2);background:rgba(63,185,80,.09);color:var(--accent2);padding:.85rem 1rem 1rem;}
.opt.correct .opt-explain{display:block;margin-top:.5rem;font-size:.84rem;color:var(--text2);font-weight:400;border-top:1px solid rgba(63,185,80,.2);padding-top:.5rem;line-height:1.6;}
.opt.wrong{border-color:var(--accent3);background:rgba(247,129,102,.09);color:var(--accent3);}
.opt-explain{display:none;}
.fb{margin-top:.55rem;padding:.6rem .85rem;border-radius:8px;font-weight:600;font-size:.88rem;display:none;}
.fb.show{display:block;}
.fb.correct{background:rgba(63,185,80,.08);color:var(--accent2);border:1px solid var(--accent2);}
.fb.wrong{background:rgba(247,129,102,.08);color:var(--accent3);border:1px solid var(--accent3);}

/* RADIO HYPOTHESE */
.radio-opts{display:flex;flex-direction:column;gap:.55rem;margin:.85rem 0;}
.radio-opt{display:flex;align-items:flex-start;gap:.75rem;background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:.85rem 1rem;cursor:pointer;transition:all .18s;}
.radio-opt:hover{border-color:var(--accent);}
.radio-opt.chosen{border-color:var(--accent);background:rgba(88,166,255,.08);}
.radio-opt input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:1px;}
.radio-opt span{color:var(--text2);font-size:.92rem;line-height:1.5;}

/* CHECKLIST */
.checklist{display:flex;flex-direction:column;gap:.45rem;margin:.5rem 0;}
.chk-item{display:flex;align-items:flex-start;gap:.7rem;padding:.65rem .8rem;background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .18s;}
.chk-item.done{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.25);}
.chk-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent2);cursor:pointer;flex-shrink:0;margin-top:2px;}
.chk-item .step-txt{color:var(--text2);font-size:.9rem;line-height:1.55;}
.chk-item.done .step-txt{opacity:.6;}

/* HELPER WORDS */
.helpers{display:flex;flex-wrap:wrap;gap:.35rem;margin:.45rem 0 .65rem;}
.hw{background:rgba(210,168,255,.07);border:1px solid rgba(210,168,255,.22);border-radius:6px;padding:.22rem .6rem;font-size:.8rem;color:var(--accent4);cursor:pointer;transition:all .18s;}
.hw:hover{background:rgba(210,168,255,.14);}

/* FIELD */
.field label{display:block;font-size:.83rem;font-weight:700;color:var(--text2);margin-bottom:.35rem;}
.field textarea{width:100%;padding:.7rem .9rem;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:.91rem;resize:vertical;min-height:78px;outline:none;transition:border-color .2s;line-height:1.6;}
.field textarea:focus{border-color:var(--accent);}
.field .hint{font-size:.76rem;color:var(--text2);margin-top:.22rem;font-style:italic;}
.field{margin:.5rem 0;}

/* HYP DISPLAY */
.hyp-card{background:rgba(210,168,255,.06);border:1px solid rgba(210,168,255,.18);border-radius:10px;padding:.9rem 1rem;margin:.65rem 0;}
.hyp-card .hyp-lbl{font-size:.76rem;font-weight:700;color:var(--accent4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem;}
.hyp-card .hyp-txt{color:var(--text2);font-style:italic;line-height:1.6;}

/* BUTTONS */
.btn-save{background:linear-gradient(135deg,#1f6feb,#388bfd);color:white;border:none;border-radius:10px;padding:.62rem 1.45rem;font-family:'Nunito',sans-serif;font-size:.91rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-save:hover{transform:translateY(-1px);}
.btn-next{background:linear-gradient(135deg,#238636,#2ea043);color:white;border:none;border-radius:10px;padding:.72rem 1.7rem;font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-next:hover{transform:translateY(-1px);}
.btn-pdf{background:linear-gradient(135deg,#6e40c9,#8957e5);color:white;border:none;border-radius:10px;padding:.72rem 1.7rem;font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.45rem;}
.btn-pdf:hover{transform:translateY(-1px);}
.nav-row{display:flex;gap:.65rem;margin-top:1.1rem;flex-wrap:wrap;align-items:center;}

/* PHASE TITLE */
.phase-t{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.55rem;display:flex;align-items:center;gap:.35rem;}

/* COMPLETION */
.done-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--accent2);border-radius:var(--radius);padding:2.25rem;text-align:center;}
.done-card .big{font-size:3.5rem;margin-bottom:.85rem;}
.done-card h2{font-family:'Outfit',sans-serif;font-size:1.65rem;font-weight:800;margin-bottom:.4rem;}
.score-n{font-size:2.8rem;font-weight:900;font-family:'Outfit',sans-serif;color:var(--accent2);line-height:1;}

/* STARS */
.star-row{display:flex;gap:.25rem;}
.star{font-size:1.3rem;cursor:pointer;filter:grayscale(1) opacity(.35);transition:transform .1s,filter .1s;}
.star.on{filter:none;}
.star:hover{transform:scale(1.2);}
.reflect-grid{display:flex;flex-direction:column;gap:.6rem;margin:.6rem 0;}
.reflect-row{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;}
.reflect-row label{flex:1;min-width:170px;color:var(--text2);font-size:.9rem;}
</style>
</head>
<body>

<div id="imgOverlay" onclick="closeImg()">
  <span class="close-x">✕ Tippen zum Schließen</span>
  <img id="overlayImg" src="" alt="">
</div>

<!-- START -->
<div id="startScreen">
  <div class="logo-circle">👁️</div>
  <h1>Das Auge</h1>
  <p>Entdecke Aufbau, Funktion und das Geheimnis des blinden Flecks</p>
  <div class="name-box">
    <label>Dein Name</label>
    <input type="text" id="nameIn" placeholder="Vorname Nachname" maxlength="40">
    <div class="class-row">
      <input type="text" id="classIn" placeholder="Klasse (z.B. 5b)" maxlength="10">
      <input type="date" id="dateIn">
    </div>
  </div>
  <button class="btn-primary" id="startBtn" disabled onclick="go()">Los geht's →</button>
</div>

<!-- CONTENT -->
<div id="contentScreen">
  <div class="top-bar">
    <span class="mod-tag">👁️ Das Auge</span>
    <div class="prog-wrap"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
    <span class="prog-lbl" id="pLbl">0/9</span>
  </div>
  <div id="stepBox"></div>
</div>

<script>
// ── state ──
let sName="",sClass="",sDate="";
let idx=0, score=0;
let saved={
  hyp:"", beob:"", fazit:"", reflectComment:"",
  reflect:{verstanden:0,spass:0,schwierig:0},
  quizAnswers:[], // [{q,chosen,correct,feedback}]
  hypChoice:""
};

document.getElementById("nameIn").addEventListener("input",function(){
  document.getElementById("startBtn").disabled=this.value.trim().length<2;
});
document.getElementById("nameIn").addEventListener("keydown",e=>{if(e.key==="Enter")go();});

function go(){
  sName=document.getElementById("nameIn").value.trim();
  sClass=document.getElementById("classIn").value.trim()||"–";
  const d=document.getElementById("dateIn").value;
  sDate=d?new Date(d).toLocaleDateString("de-DE"):new Date().toLocaleDateString("de-DE");
  if(sName.length<2)return;
  document.getElementById("startScreen").style.display="none";
  document.getElementById("contentScreen").style.display="block";
  render();
}

// ── steps ──
const STEPS=[
  {id:"text1",  lbl:"📖 Sachtext 1"},
  {id:"zuord",  lbl:"🏷️ Zuordnung"},
  {id:"quiz1",  lbl:"❓ Fragen 1"},
  {id:"video",  lbl:"🎬 Video"},
  {id:"quiz2",  lbl:"❓ Fragen 2"},
  {id:"expIntro",lbl:"🔬 Experiment"},
  {id:"expMain", lbl:"🔬 Durchführung"},
  {id:"expExp",  lbl:"💡 Erklärung"},
  {id:"reflect", lbl:"✅ Abschluss"},
];
const TOTAL=STEPS.length;

function updProg(){
  document.getElementById("pFill").style.width=Math.round(idx/TOTAL*100)+"%";
  document.getElementById("pLbl").textContent=idx+"/"+TOTAL;
}
function next(){idx++;render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  updProg();
  if(idx>=TOTAL){renderDone();return;}
  const c=document.getElementById("stepBox");
  c.innerHTML="";
  const s=STEPS[idx];
  if(s.id==="text1")    renderText1(c);
  else if(s.id==="zuord")  renderZuord(c);
  else if(s.id==="quiz1")  renderQuiz(c,QUIZ1,"❓ Fragen zum Aufbau",1);
  else if(s.id==="video")  renderVideo(c);
  else if(s.id==="quiz2")  renderQuiz(c,QUIZ2,"❓ Fragen zum Video",2);
  else if(s.id==="expIntro")renderExpIntro(c);
  else if(s.id==="expMain") renderExpMain(c);
  else if(s.id==="expExp")  renderExpExp(c);
  else if(s.id==="reflect") renderReflect(c);
}

// ════════════════════════════════════════
// TEXT 1
// ════════════════════════════════════════
function renderText1(c){
  c.innerHTML=`
  <div class="card">
    <div class="badge">📖 Sachtext 1 – Aufbau des Auges</div>
    <h3>Wie ist unser Auge aufgebaut?</h3>
    <p>Das Auge ist unser wichtigstes Sinnesorgan. Schau dir das Schaubild genau an, während du den Text liest.</p>
    <div class="img-wrap">
      <img src="AufbauAuge.jpg" alt="Aufbau des Auges" onclick="openImg(this.src)">
      <div class="img-hint">🔍 Auf das Bild klicken für Vollbild</div>
    </div>
    <p>Von außen erkennst du die <strong>Hornhaut</strong> – eine durchsichtige, gewölbte Schutzschicht. Dahinter liegt die farbige <strong>Iris</strong>, die deine Augenfarbe bestimmt. In ihrer Mitte befindet sich die <strong>Pupille</strong> – die schwarze Öffnung, durch die Licht ins Auge gelangt.</p>
    <p>Hinter der Pupille liegt die <strong>Linse</strong>. Sie bündelt das Licht auf die <strong>Netzhaut</strong> auf der Rückseite des Auges. Dort sitzen Millionen Sinneszellen: <strong>Stäbchen</strong> (Hell/Dunkel) und <strong>Zapfen</strong> (Farben).</p>
    <p>Die Signale der Netzhaut werden über den <strong>Sehnerv</strong> ans <strong>Gehirn</strong> geleitet. Erst das Gehirn erzeugt das vollständige Bild, das wir bewusst wahrnehmen.</p>
    <div class="info-box">💡 Das Auge ist nur 24 mm groß – enthält aber über 130 Millionen Sinneszellen!</div>
    <p>Das <strong>Augenlid</strong> schützt das Auge durch reflexartiges Schließen. Die <strong>Tränenflüssigkeit</strong> hält die Oberfläche feucht, sauber und keimfrei.</p>
    <div class="warn-box">🤔 <strong>Denke schon mal nach:</strong> Der Sehnerv verlässt das Auge an einer bestimmten Stelle. Was könnte das für unser Sehen bedeuten? Du wirst es im Experiment selbst herausfinden!</div>
    <div class="success-box">👁️ <strong>Alltagsbeispiel:</strong> Wenn du nach draußen in die Sonne gehst, kneifen die Augen kurz – die Pupille wird kleiner, um sie vor zu viel Licht zu schützen. Genau dieses Prinzip erlebst du auch im Experiment am Ende dieses Moduls!</div>
    <div class="nav-row"><button class="btn-next" onclick="next()">Weiter zur Zuordnung →</button></div>
  </div>`;
}

// ════════════════════════════════════════
// ZUORDNUNG
// ════════════════════════════════════════
function renderZuord(c){
  const terms=["Hornhaut","Iris","Pupille","Linse","Netzhaut","Sehnerv","Stäbchen & Zapfen","Gehirn"];
  const slots=[
    {id:"z1",lbl:"Äußere durchsichtige Schutzschicht",ans:"Hornhaut"},
    {id:"z2",lbl:"Farbiger Ringmuskel – bestimmt die Augenfarbe",ans:"Iris"},
    {id:"z3",lbl:"Schwarze Öffnung, durch die Licht ins Auge fällt",ans:"Pupille"},
    {id:"z4",lbl:"Bündelt das Licht auf die Netzhaut",ans:"Linse"},
    {id:"z5",lbl:"Innenauskleidung mit Millionen Sinneszellen",ans:"Netzhaut"},
    {id:"z6",lbl:"Leitet Signale vom Auge zum Gehirn",ans:"Sehnerv"},
    {id:"z7",lbl:"Sinneszellen für Hell/Dunkel und Farben",ans:"Stäbchen & Zapfen"},
    {id:"z8",lbl:"Verarbeitet die Signale und erzeugt das Bild",ans:"Gehirn"},
  ];
  let sel=null,filled={},used={};
  function draw(){
    c.innerHTML=`
    <div class="card">
      <div class="badge">🏷️ Zuordnung</div>
      <h3>Was gehört wohin?</h3>
      <p style="color:var(--text2);margin-bottom:.9rem"><strong style="color:var(--text)">So geht's:</strong> Klicke zuerst einen Begriff an (er leuchtet auf), dann klicke das passende Feld.</p>
      <div class="img-wrap">
        <img src="Zuordnung.jpg" alt="Auge Schaubild" onclick="openImg(this.src)" style="max-height:270px;object-fit:contain;">
        <div class="img-hint">🔍 Bild vergrößern – als Hilfe beim Zuordnen nutzen</div>
      </div>
      <div class="term-pool-lbl">Begriffe</div>
      <div class="term-pool">${terms.map(t=>`<div class="chip ${sel===t?'sel':''} ${used[t]?'used':''}" onclick="__zs('${t}')">${t}</div>`).join('')}</div>
      <div>${slots.map((s,i)=>{const v=filled[s.id],ok=v&&v===s.ans,bad=v&&v!==s.ans;return`<div class="slot ${ok?'ok':bad?'bad':''}" onclick="__zd('${s.id}')"><span class="slot-n">${i+1}</span><span class="slot-lbl">${s.lbl}</span><span class="slot-val">${v?v+' '+(ok?'✓':bad?'✗':''):'<span style="color:var(--border)">— wählen —</span>'}</span></div>`;}).join('')}</div>
      <div id="zfb" style="margin-top:.6rem"></div>
      <div class="nav-row"><button class="btn-save" onclick="__zchk()">Überprüfen ✓</button></div>
    </div>`;
  }
  window.__zs=t=>{if(used[t])return;sel=sel===t?null:t;draw();};
  window.__zd=id=>{
    if(!sel)return;
    Object.keys(filled).forEach(k=>{if(filled[k]===sel)delete filled[k];});
    filled[id]=sel;terms.forEach(t=>{used[t]=Object.values(filled).includes(t);});sel=null;draw();
  };
  window.__zchk=()=>{
    let ok=0;slots.forEach(s=>{if(filled[s.id]===s.ans)ok++;});
    const fb=document.getElementById("zfb");
    if(ok===slots.length){fb.innerHTML=`<div class="fb correct show">🎉 Perfekt! Alle ${slots.length} richtig!</div>`;score+=slots.length;setTimeout(()=>next(),1500);}
    else{slots.forEach(s=>{if(filled[s.id]&&filled[s.id]!==s.ans){used[filled[s.id]]=false;delete filled[s.id];}});draw();document.getElementById("zfb").innerHTML=`<div class="fb wrong show">${ok}/${slots.length} richtig – falsche Felder zurückgesetzt. Versuche es nochmal!</div>`;}
  };
  draw();
}

function renderQuiz(c,qs,label,qid){
  let qi=0,right=0;
  const answers=[];
  function rq(){
    if(qi>=qs.length){
      score+=right;
      saved.quizAnswers[qid]=answers;
      c.innerHTML=`<div class="card">
        <div class="badge">${label}</div>
        <div style="text-align:center;padding:1rem 0">
          <div style="font-size:2.2rem;margin-bottom:.4rem">${right===qs.length?'🎉':'👍'}</div>
          <h3>${right}/${qs.length} Fragen richtig</h3>
          <p style="color:var(--text2);margin-top:.35rem">${right===qs.length?'Perfekt gemacht!':'Gut – weiter geht\'s!'}</p>
        </div>
        <div class="nav-row"><button class="btn-next" onclick="next()">Weiter →</button></div>
      </div>`;return;
    }
    const q=qs[qi];
    c.innerHTML=`<div class="card">
      <div class="badge">${label} (${qi+1}/${qs.length})</div>
      <div class="q-txt">${q.q}</div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="__qa(${i})" data-i="${i}">${o}<span class="opt-explain"></span></button>`).join('')}</div>
      <div class="fb" id="qfb"></div>
    </div>`;
  }
  window.__qa=idx=>{
    const q=qs[qi];
    const btns=document.querySelectorAll(".opt");
    btns.forEach(b=>b.disabled=true);
    const isRight=idx===q.c;
    btns[idx].classList.add(isRight?"correct":"wrong");
    btns[q.c].classList.add("correct");
    // expand correct answer with explanation
    btns[q.c].querySelector(".opt-explain").textContent=q.explain;
    answers.push({q:q.q,chosen:q.opts[idx],correct:q.opts[q.c],wasRight:isRight});
    if(isRight)right++;
    setTimeout(()=>{qi++;rq();},2400);
  };
  rq();
}

  {icon:"👅", title:"Die Zunge",      desc:"Aufbau, Funktion & Schmeckexperiment"},
  {icon:"✋", title:"Die Haut",       desc:"Aufbau, Funktion & Tastexperiment"},
  {icon:"🧠", title:"Gehirn & Nerven",desc:"Aufbau, Funktion & Gehirnexperiment"},
];

  document.getElementById("pFill").style.width="100%";
  document.getElementById("pLbl").textContent=TOTAL+"/"+TOTAL;

  // Save to Google Sheets
  saveToSheets();
  // Also store locally that Auge is done
  localStorage.setItem("sinnes_auge_done", score);

  const moduleCards = NEXT_MODULES.map(m => `
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;display:flex;align-items:center;gap:.85rem;opacity:.55;">
      <div style="font-size:1.8rem;filter:grayscale(1)">${m.icon}</div>
      <div>
        <div style="font-weight:700;font-size:.95rem;color:var(--text2)">${m.title}</div>
        <div style="font-size:.8rem;color:var(--text2);margin-top:.15rem">${m.desc}</div>
        <div style="font-size:.75rem;color:var(--border);margin-top:.3rem;font-weight:700;">🔒 Noch nicht verfügbar</div>
      </div>
    </div>`).join('');

  document.getElementById("stepBox").innerHTML=`
  <div class="done-card">
    <div class="big">&#9989;</div>
    <h2>Das Auge – abgeschlossen!</h2>
    <p style="color:var(--text2);margin-bottom:1.25rem">Sehr gut gemacht, ${sName}!</p>
    <div style="background:var(--surface2);border-radius:12px;padding:1rem;margin-bottom:1.5rem">
      <div class="score-n">${score}</div>
      <div style="color:var(--text2);font-size:.88rem;margin-top:.2rem">Punkte erreicht</div>
    </div>
    <button class="btn-pdf" onclick="makePDF()" style="width:100%;justify-content:center;margin-bottom:.65rem;">&#128196; Protokoll als PDF herunterladen</button>

    <div style="margin-top:1.75rem;text-align:left;">
      <div style="font-family:'Outfit',sans-serif;font-weight:800;font-size:1rem;margin-bottom:.85rem;color:var(--text)">
        🔍 Weitere Sinnesdetektiv-Module
      </div>
      <div style="display:flex;flex-direction:column;gap:.5rem;">
        ${moduleCards}
      </div>
      <p style="color:var(--text2);font-size:.8rem;margin-top:.85rem;text-align:center;">
        Die weiteren Module werden von deinem Lehrer freigeschaltet.
      </p>
    </div>
  </div>`;
}

// HELPERS

function insertH(id,w){
  const ta=document.getElementById(id);if(!ta)return;
  const p=ta.selectionStart,b=ta.value.substring(0,p),a=ta.value.substring(p);
  const sep=b.length>0&&!b.endsWith(" ")?" ":"";
  ta.value=b+sep+w+" "+a;ta.selectionStart=ta.selectionEnd=p+sep.length+w.length+1;ta.focus();
}
function openImg(src){document.getElementById("overlayImg").src=src;document.getElementById("imgOverlay").classList.add("show");}
function closeImg(){document.getElementById("imgOverlay").classList.remove("show");}

// ════════════════════════════════════════
// PDF
function makePDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,H=297,ML=15,MR=195,TW=MR-ML;
  let y=14;

  const C={
    bg:[13,17,23],surf:[22,27,34],surf2:[30,37,48],
    border:[48,54,61],blue:[88,166,255],green:[63,185,80],
    orange:[255,166,87],purple:[210,168,255],red:[247,129,102],
    text:[220,230,240],text2:[139,148,158]
  };

  function setF(c){doc.setFillColor(...c);}
  function setS(c,w=0.25){doc.setDrawColor(...c);doc.setLineWidth(w);}
  function setT(c,sz,bold=false){doc.setTextColor(...c);doc.setFontSize(sz);doc.setFont("helvetica",bold?"bold":"normal");}
  function chk(n=12){if(y+n>H-12){doc.addPage();setF(C.bg);doc.rect(0,0,W,H,"F");y=14;}}

  // clean string: remove all non-latin chars that jsPDF can't handle
  function cl(s){
    if(!s)return"";
    return s.replace(/[^␀-ÿ]/g,"").replace(/–/g,"-").replace(/—/g,"-")
            .replace(/“|”/g,'"').replace(/‘|’/g,"'")
            .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
            .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue")
            .replace(/ß/g,"ss");
  }

  function hdr(prefix,txt,col){
    chk(12);
    setT(col,9.5,true);
    const full=prefix+" "+cl(txt);
    doc.text(full,ML,y);
    setS(col,0.4);doc.line(ML,y+1.8,ML+doc.getTextWidth(full),y+1.8);
    y+=8;
  }

  function para(txt,col=C.text2,sz=9){
    setT(col,sz);
    const lines=doc.splitTextToSize(cl(txt),TW);
    lines.forEach(l=>{chk(6);doc.text(l,ML,y);y+=5;});
    y+=1;
  }

  function fillBox(txt,bg,border,tcol=C.text,pad=4){
    const lines=doc.splitTextToSize(cl(txt),TW-pad*2-2);
    const bh=lines.length*5+pad+4;
    chk(bh+3);
    setF(bg);setS(border,0.25);doc.roundedRect(ML,y,TW,bh,2,2,"FD");
    setT(tcol,8.5);
    lines.forEach((l,i)=>doc.text(l,ML+pad,y+pad+i*5));
    y+=bh+4;
  }

  function answerBox(label,content,minH=16){
    chk(minH+12);
    setT(C.text2,8,true);doc.text(cl(label),ML,y);y+=4;
    const lines=content?doc.splitTextToSize(cl(content),TW-8):[];
    const bh=Math.max(minH,lines.length*5+7);
    chk(bh+4);
    setF(C.surf2);setS(C.border,0.25);doc.roundedRect(ML,y,TW,bh,2,2,"FD");
    if(content){setT(C.text,8.5);lines.forEach((l,i)=>doc.text(l,ML+4,y+5+i*5));}
    y+=bh+5;
  }

  function divider(){chk(5);setS(C.border,0.2);doc.line(ML,y,MR,y);y+=6;}

  function renderQuizBlock(answers){
    if(!answers||answers.length===0){para("(Keine Antworten gespeichert)",C.text2,8.5);return;}
    answers.forEach((a,i)=>{
      chk(22);
      setT(C.text,9,true);
      const qlines=doc.splitTextToSize((i+1)+". "+cl(a.q),TW);
      qlines.forEach(l=>{chk(6);doc.text(l,ML,y);y+=5;});
      const isRight=a.wasRight;
      // answer box
      const atxt=(isRight?"[Richtig] ":"[Falsch] ")+"Deine Antwort: "+cl(a.chosen);
      const alines=doc.splitTextToSize(atxt,TW-8);
      const abh=alines.length*5+6;
      chk(abh+3);
      setF(isRight?[18,48,22]:[48,18,18]);setS(isRight?C.green:C.red,0.2);
      doc.roundedRect(ML,y,TW,abh,2,2,"FD");
      setT(isRight?C.green:C.red,8.5);
      alines.forEach((l,j)=>doc.text(l,ML+4,y+5+j*5));
      y+=abh+2;
      if(!isRight){
        const ctxt="Richtige Antwort: "+cl(a.correct);
        const clines=doc.splitTextToSize(ctxt,TW-8);
        const cbh=clines.length*5+6;
        chk(cbh+3);
        setF([18,48,22]);setS(C.green,0.2);
        doc.roundedRect(ML,y,TW,cbh,2,2,"FD");
        setT(C.green,8.5);
        clines.forEach((l,j)=>doc.text(l,ML+4,y+5+j*5));
        y+=cbh+2;
      }
      y+=4;
    });
  }

  // === PAGE BG ===
  setF(C.bg);doc.rect(0,0,W,H,"F");

  // === HEADER ===
  setF(C.surf);setS(C.blue,0.4);doc.roundedRect(ML-2,y-3,TW+4,32,3,3,"FD");
  setT(C.blue,15,true);doc.text("Das Auge",ML+2,y+6);
  setT(C.text2,8.5);doc.text("Sinnesdetektiv - Biologie Klasse 5/6",ML+2,y+13);
  setT(C.text2,8);
  doc.text("Name: "+cl(sName),ML+2,y+21);
  doc.text("Klasse: "+cl(sClass),ML+55,y+21);
  doc.text("Datum: "+cl(sDate),ML+95,y+21);
  doc.text("Punkte: "+score,MR-5,y+21,{align:"right"});
  y+=38;

  // === QUIZ 1 ===
  hdr("1.","Fragen zum Aufbau",C.blue);
  renderQuizBlock(saved.quizAnswers[1]);
  divider();

  // === QUIZ 2 ===
  hdr("2.","Fragen zum Video",C.blue);
  renderQuizBlock(saved.quizAnswers[2]);
  divider();

  // === EXPERIMENT ===
  hdr("3.","Experiment: Der blinde Fleck",C.orange);

  hdr("3a.","Fragestellung",C.blue);
  fillBox("Hat unser Auge eine Stelle, an der es nichts sieht - obwohl das Auge offen ist?",C.surf2,C.blue);

  hdr("3b.","Hypothese",C.purple);
  const hypTxt=saved.hypChoice==="b"?"Der Punkt koennte verschwinden.":"Ich werde alles sehen.";
  fillBox(hypTxt+(saved.hyp?" - "+saved.hyp:""),C.surf2,C.purple);

  hdr("3c.","Material und Versuchsaufbau",C.orange);
  para("- Ein Blatt Papier   - Ein Stift",C.text2,9);
  fillBox("Zeichne: Links ein grosses + (Kreuz) und rechts einen grossen Punkt, Abstand ca. 15 cm.",C.surf2,C.orange,C.orange);

  hdr("3d.","Durchfuehrung",C.orange);
  const expSteps=[
    "Blatt in Armabstand halten.",
    "Rechtes Auge schliessen.",
    "Mit linkem Auge fest auf das + schauen - nicht abschauen!",
    "Blatt langsam auf sich zuziehen.",
    "Beobachten, was mit dem Punkt passiert.",
  ];
  expSteps.forEach((s,i)=>{
    chk(9);
    setF(C.surf2);setS(C.border,0.2);doc.roundedRect(ML,y,TW,7.5,1.5,1.5,"FD");
    setT(C.orange,8.5,true);doc.text(""+(i+1),ML+3,y+5.2);
    setT(C.text2,8.5,false);doc.text(cl(s),ML+11,y+5.2);
    y+=9;
  });
  y+=2;

  hdr("3e.","Beobachtung",C.blue);
  answerBox("Was habe ich beobachtet?",saved.beob||"",20);

  hdr("3f.","Erklaerung",C.green);
  fillBox("An der Stelle, wo der Sehnerv das Auge verlaesst, kann das Auge nichts sehen. Das Gehirn fuellt diese Luecke automatisch auf, sodass wir sie im Alltag nie bemerken.",C.surf2,C.green);

  hdr("3g.","Fragen zur Erklaerung",C.blue);
  renderQuizBlock(saved.quizAnswers[3]);

  hdr("3h.","Fazit",C.purple);
  answerBox("Zusammenfassung in eigenen Worten:",saved.fazit||"",18);
  divider();

  // === REFLEXION ===
  hdr("4.","Reflexion",C.green);
  const rL={verstanden:"Aufbau des Auges verstanden",spass:"Experiment hat Spass gemacht",schwierig:"Aufgaben gut zu schaffen"};
  Object.entries(rL).forEach(([k,lbl])=>{
    chk(9);
    setT(C.text2,8.5);doc.text(cl(lbl)+":",ML,y);
    const val=saved.reflect[k]||0;
    for(let i=0;i<5;i++){
      setT(i<val?C.orange:C.border,11,false);
      doc.text(i<val?"*":"o",MR-30+i*7,y);
    }
    y+=7;
  });
  if(saved.reflectComment){y+=2;answerBox("Kommentar:",saved.reflectComment,12);}

  // === FOOTER all pages ===
  const np=doc.getNumberOfPages();
  for(let p=1;p<=np;p++){
    doc.setPage(p);
    setF(C.bg);doc.rect(0,H-10,W,10,"F");
    setT(C.border,7.5);
    doc.text("Sinnesdetektiv - Biologie Klasse 5/6 | mindcraft-fes",ML,H-4);
    doc.text("Seite "+p+" / "+np,MR,H-4,{align:"right"});
  }

  doc.save("Sinnesdetektiv_Auge_"+cl(sName).replace(/\s+/g,"_")+"_"+cl(sClass)+".pdf");
}
</script>
